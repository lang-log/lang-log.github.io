# Check the code (quality.yml: Prettier, ESLint, markdownlint, html-validate, Stylelint, ShellCheck, Ruff), then build and check the site
# (tools/build_site.sh), for every pull request and every push to main. The build runs only when
# the code checks pass.
# For pull requests from this repository (not forks or Dependabot) it also uploads a preview as
# the artifact "preview"; previews.yml publishes it on Cloudflare Pages at
# https://pr-<number>.lang-log-preview.pages.dev/ and links it on the pull request (shared rule:
# research-aide .claude/rules/pr-previews.md).
# For pushes to the beta branch it uploads the same part of the site, with Cloudflare's _headers
# file, as the artifact "beta"; beta.yml publishes it at https://lang-log-beta.pages.dev/.
# The preview and the beta hold only part of the site (tools/make_preview.sh says which and why).
name: site
on:
  pull_request:
  push:
    branches: [main, beta]
  workflow_dispatch:
permissions:
  contents: read
# A newer push to a pull request cancels the older run. Every run on main or beta gets a group of its own,
# so none is cancelled or replaced and every commit on main gets a result (a cancelled run shows as
# "failing" on the README badge).
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('site-{0}', github.ref) || format('site-{0}', github.run_id) }}
  cancel-in-progress: true
jobs:
  quality:
    uses: ./.github/workflows/quality.yml
  build:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The releases for dist/releases.html (read-only token; tools/build_releases.py).
      - run: python3 tools/build_releases.py --fetch
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: python3 -m pip install --require-hashes -r requirements.txt
      - run: bash tools/build_site.sh
      # The built pages are valid HTML (.htmlvalidate.json): the top page, the Releases page, the
      # info pages, every top-level record page and every record page of one family.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci --ignore-scripts
      - run: npx html-validate dist/index.html dist/releases.html "dist/*/index.html" "dist/afro-asiatic/**/index.html"
      # The map view keeps its key, buttons and lines the same size on screen at every browser
      # zoom, in Chromium, Firefox and WebKit (tools/check_map_view.js).
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: node tools/check_map_view.js
      - name: Make the preview (all but the record pages of other families)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
        run: bash tools/make_preview.sh _preview
      - if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
        uses: actions/upload-artifact@v4
        with:
          name: preview
          path: _preview
          retention-days: 90
      # The beta site: the same part of the site, plus the response headers Cloudflare sends
      # (tools/security_policy.py HEADERS, with noindex).
      - name: Make the beta site
        if: github.event_name == 'push' && github.ref == 'refs/heads/beta'
        run: |
          bash tools/make_preview.sh _beta
          python3 tools/security_policy.py --headers _beta
      - if: github.event_name == 'push' && github.ref == 'refs/heads/beta'
        uses: actions/upload-artifact@v4
        with:
          name: beta
          path: _beta
          retention-days: 7

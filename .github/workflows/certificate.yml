# Daily check that GitHub keeps renewing the HTTPS certificate for the custom domain while
# Cloudflare proxies it (tools/certificate_renewal.py, .claude/rules/security.md). When
# renewal is stuck, it turns the Cloudflare proxy off for the site's records, waits for
# GitHub's new certificate and turns it back on, and tells the owner by email through one
# issue ("Certificate renewal for <domain>") at each step.
name: certificate
on:
  schedule:
    - cron: "23 21 * * *" # every day 21:23 UTC (06:23 in Japan)
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: certificate
  cancel-in-progress: false
jobs:
  renewal:
    runs-on: ubuntu-latest
    # The Cloudflare token can change DNS, so it lives in the "dns" environment, which
    # only the default branch may use (Settings > Environments > dns).
    environment: dns
    timeout-minutes: 75
    permissions:
      contents: read
      pages: read # the custom domain in the Pages settings
      issues: write # the issue that emails the owner
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/certificate_renewal.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_DNS_TOKEN: ${{ secrets.CLOUDFLARE_DNS_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          # The email texts (tools/certificate_renewal.py, MESSAGE_SECRETS).
          CERT_MAIL_DETECTED: ${{ secrets.CERT_MAIL_DETECTED }}
          CERT_MAIL_RENEWED: ${{ secrets.CERT_MAIL_RENEWED }}
          CERT_MAIL_FAILED: ${{ secrets.CERT_MAIL_FAILED }}
          NOTIFY_LOGIN: nguekwang # assigned to the issue, so the owner gets each email

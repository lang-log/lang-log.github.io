# Publish the site with GitHub Pages at https://lang-log.github.io/ (the organization site of
# lang-log), plus a preview of every open pull request at /preview/pr-<number>/ with a link
# comment on the pull request. The shared workflow in nguekwang/research-aide does the work
# (rule: research-aide .claude/rules/pr-previews.md); site.yml builds and checks pull requests.
# All paths in dist/ are relative, so the site files work at any prefix.
# It also runs when release.yml has created a release, so the Releases page (dist/releases.html)
# shows it (.claude/rules/releases.md).
#
# One-time setup by the owner: Settings > Pages > Build and deployment >
# Source: "GitHub Actions".
name: pages
on:
  push:
    branches: [main]
  workflow_run:
    workflows: [site, release]
    types: [completed]
  pull_request_target:
    types: [closed]
  workflow_dispatch:
permissions:
  contents: read
# One deploying run at a time, whatever started it (a push, a pull request preview, a release),
# and never cancelled while it works. While one runs, GitHub keeps only the newest waiting run in
# the group; that run reads the releases and the previews when it starts, so it publishes
# everything the replaced runs would have. Runs that deploy nothing (a site.yml run of a push)
# get a group of their own, so they never replace a waiting run that deploys.
# The condition is the one of the "wanted" job below; keep the two equal.
concurrency:
  group: ${{ (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.event == 'pull_request' || github.event.workflow_run.name == 'release'))) && 'pages' || format('pages-idle-{0}', github.run_id) }}
  cancel-in-progress: false
jobs:
  # Whether this run deploys: every trigger except a workflow_run of a site.yml run that was not a
  # pull request, or of a run that failed. The other jobs need it, so they are skipped with it.
  wanted:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.event == 'pull_request' || github.event.workflow_run.name == 'release'))
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - run: echo "deploying after ${{ github.event_name }}"
  # Every run deploys the default branch (the shared workflow builds it), so the code checks run on
  # the default branch first and nothing is deployed when they fail. site.yml checks each pull
  # request's own code before its preview is uploaded.
  quality:
    needs: wanted
    uses: ./.github/workflows/quality.yml
    with:
      ref: ${{ github.event.repository.default_branch }}
  # The releases for dist/releases.html, read with a token that can only read and handed to the
  # build as the artifact "github-releases" (tools/build_releases.py --fetch writes
  # build/github-releases.json). If the API cannot be read, nothing is deployed.
  releases:
    needs: wanted
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/build_releases.py --fetch
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        with:
          name: github-releases
          path: build/github-releases.json
          retention-days: 1
  publish:
    needs: [quality, releases]
    permissions:
      contents: read
      actions: read
      pull-requests: write
      pages: write
      id-token: write
    uses: nguekwang/research-aide/.github/workflows/pages-with-previews.yml@main
    with:
      build: |
        python3 -m pip install --require-hashes -r requirements.txt
        bash tools/build_site.sh
      site-dir: dist
      # Downloaded into build/ before the build (research-aide pages-with-previews.yml).
      artifact: github-releases
      artifact-path: build
      preview-workflow: site.yml
      links: |
        Top page|
        Language families|#families
        Signs and scripts|signs-and-scripts.html
        A record page|afro-asiatic/berber/
        Releases|releases.html

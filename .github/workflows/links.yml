# Weekly check of every link on the built site, between its own pages and to other sites
# (sources, papers, DOIs), with lychee (lychee.toml). When a link is broken, this opens (or
# updates) one issue titled "Broken links on the site". It does not block pull requests.
name: links
on:
  schedule:
    - cron: "41 0 * * 1" # every Monday 00:41 UTC (09:41 in Japan)
  workflow_dispatch:
permissions:
  contents: read
jobs:
  links:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # The releases for dist/releases.html (read-only; tools/build_releases.py).
      - run: python3 tools/build_releases.py --fetch
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: python3 -m pip install --require-hashes -r requirements.txt
      - run: bash tools/build_site.sh
      - id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config lychee.toml --no-progress "dist/**/*.html"
          output: links-report.md
          fail: false
      - name: Open or update the issue
        if: steps.lychee.outputs.exit_code != 0
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const title = 'Broken links on the site';
            const body = fs.readFileSync('links-report.md', 'utf8').slice(0, 60000) +
              `\n\nFound by the weekly link check: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { owner, repo } = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'open' });
            const old = issues.find(i => i.title === title && !i.pull_request);
            if (old) await github.rest.issues.update({ owner, repo, issue_number: old.number, body });
            else await github.rest.issues.create({ owner, repo, title, body });

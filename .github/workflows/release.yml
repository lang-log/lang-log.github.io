# Create a GitHub Release when a version tag (v1.2.0) is pushed. The owner picks the version and
# tags a commit of main; tools/release.py checks the tag and creates the release, without
# changing a release that already exists (.claude/rules/releases.md).
# The site is not deployed here: pages.yml runs when this workflow ends (workflow_run) and
# rebuilds the Releases page from the GitHub API, after the usual code checks.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release; nothing else
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, to check that the tag is on main.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # actions/checkout can store an annotated tag as a lightweight one; fetch the tag object
      # itself so its message and tagger are kept. The tag name comes in through env, never
      # written into the script.
      - name: Fetch the tag and main
        env:
          TAG: ${{ github.ref_name }}
        run: git fetch --force --no-tags origin "+refs/tags/${TAG}:refs/tags/${TAG}" "+refs/heads/main:refs/remotes/origin/main"
      - name: Create the release
        env:
          TAG: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/release.py "$TAG"
  # The interface languages, one ZIP each (LANGS in dist/lang.js, read by tools/build_i18n.py).
  languages:
    runs-on: ubuntu-latest
    outputs:
      codes: ${{ steps.list.outputs.codes }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python3 -m pip install --require-hashes -r requirements.txt
      - id: list
        run: echo "codes=$(python3 tools/build_i18n.py --languages)" >> "$GITHUB_OUTPUT"
  # The whole site as Markdown and PDF in each language, attached to the release as
  # lang-log.<code>.zip (the owner's decision, 2026-11-24; .claude/rules/releases.md). A ZIP the
  # release already has is left as it is.
  offline:
    needs: [release, languages]
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write # attach the ZIP to the release; nothing else
    strategy:
      fail-fast: false
      matrix:
        code: ${{ fromJSON(needs.languages.outputs.codes) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: python3 -m pip install --require-hashes -r requirements.txt
      - run: npm ci --ignore-scripts
      # Chromium, and fonts for every interface language's script (Noto, SIL Open Font License).
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get install -y --no-install-recommends fonts-noto-core fonts-noto-cjk
      - run: bash tools/build_site.sh
      - run: node tools/offline_zip.js "$CODE"
        env:
          CODE: ${{ matrix.code }}
      - name: Attach the ZIP
        env:
          CODE: ${{ matrix.code }}
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          name="lang-log.$CODE.zip"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qx "$name"; then
            echo "$name is already attached; leaving it as it is"
            exit 0
          fi
          (cd build/offline && zip -qr "$name" "lang-log.$CODE")
          gh release upload "$TAG" "build/offline/$name" --repo "$GITHUB_REPOSITORY"

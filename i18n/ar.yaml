    this_is_coverage_of_the: "هذه تغطية المدونة المستوردة، وليست كل المنشورات في العالم."
    coverage_is_limited_to_the: "تقتصر التغطية على المصادر المستوردة. عدم عرض بديل لا يعني وجود إجماع."
    catalog_completeness_is_measured_against: "تُقاس اكتمالية الفهارس بالنسخ المستوردة. تغطية البحوث جزئية، وغياب الفروع لا يعني الاتفاق."
    branches_are_conditional_on_their: "الفروع مشروطة بمصدرها. تظهر المواضع المختلفة معًا؛ ولا حاجة إلى تبديل المصدر."
    independent_families_and_isolates_are: "الأسر المستقلة واللغات المعزولة جذور متوازية. وسّع كل فرع لتتبّع تصنيفه المسجَّل."
    click_a_row_to_expand: "انقر على صف لتوسيعه وفحصه. اختر لغة لمقارنة مواضعها بحسب كل مصدر والبدائل المرتبطة بالبحوث. وسّع فرع دراسة ضمن المخطط نفسه."
    expand_a_row_to_follow: "وسّع صفًا لتتبّع فروعه. اختر «التفاصيل» لعرض كل المواضع والاستشهادات. الأسماء المتكررة تشير إلى السجل نفسه."
    each_placement_says_according_to: "يذكر كل موضع «وفقًا لـ [المصدر]» ويربط ببحثه أو فهرسه. لا تُقدَّم تصنيفات الفهارس على أنها بحوث فردية."
    different_parent_names_alone_do: "اختلاف أسماء المستوى الأعلى وحده لا يثبت التعارض. في كل زوج من أشجار الدراسات، يقارن الأطلس الفروع المقصورة على ثلاثة معرّفات لغوية متطابقة على الأقل من العينات. وتُوسم الفروع المتقاطعة غير المتداخلة بأنها غير متوافقة طوبولوجيًا."
    different_sampling_unresolved_polytomies_and: "اختلاف العينات، والتفرعات المتعددة غير المحسومة، وتكرار ربط أنماط محلية مختلفة، ليست في ذاتها دليلًا على نسب متعارض. وتُستبعد المعرّفات الطرفية المتكررة أو المتداخلة من المقارنة الآلية للتعارض."
    a_conflicting_summary_topology_does: "تعارض الطوبولوجيا الموجزة لا يحدد أي ادعاء علمي هو الصحيح. لم تُراجَع حالة عدم اليقين البعدي ولا كل التحليلات داخل كل بحث."
    a_script_is_not_a: "الكتابة ليست أسرة لغوية. الانحدار التاريخي والتأثير الخطي واستعمال اللغات أمور مختلفة؛ وغياب الأصل يعني أنه لم يُراجَع، لا أنه دليل على اختراع مستقل."
    a_shared_writing_system_or: "الاشتراك في نظام كتابة أو أبجدية يدوية ليس دليلًا على اشتراك اللغات في أصل واحد."
    all_imported_historical_and_influence: "تظهر كل الادعاءات المستوردة عن التاريخ والتأثير معًا؛ ويحمل كل رابط مصدره ودرجة عدم اليقين."
    glottolog_classifications_lexical_feature_study: "تشترك تصنيفات Glottolog وأشجار الدراسات القائمة على السمات المعجمية ومجموعات الأبجديات اليدوية في السجلات نفسها، لكنها تُبقي أدلتها منفصلة. فئات التنقل ليست أسلافًا عامة."
    source_specific_sampled_clades_share: "تشترك الفروع المأخوذة من عينات كل مصدر في سجلات اللغات نفسها. والتحليلان الأوروبيان تكرار لدراسة واحدة."
    historical_descent_graphic_influence_sample: "الانحدار التاريخي والتأثير الخطي وهوية العينة واستعمال الكتابة علاقات مختلفة. ولا يُدّعى وجود سلف مشترك شامل."
    these_records_remain_searchable_and: "تبقى هذه السجلات قابلة للبحث والفحص. عدم عرض صلة ليس ادعاءً بأصل مستقل."
    standard_chapters_are_sections_of: "فصول المعيار أقسام من منشور واحد، وليست دراسات مستقلة. ويُميَّز بين المراجع الببليوغرافية ومجموعات البيانات المستوردة."
    the_transeurasian_paper_level_debate: "يشمل الجدل البحثي حول الفرضية العبر-أوراسية الاقتراح والنقد والرد. وهذا منفصل عن المقارنة الآلية للطوبولوجيا."
    these_summary_clades_cannot_both: "لا يمكن أن تصح هذه الفروع الموجزة معًا على الأطراف المشتركة من العينات. وهذا لا يحدد أي دراسة هي الصحيحة. قد تتعلق الأمثلة أدناه بمجموعة أوسع تضم هذا السجل."
    this_atlas_preserves_every_imported: "يحفظ هذا الأطلس كل ادعاء تصنيفي مستورد مع مصدره. تشترك المطابقات التامة لـ Glottocode في سجل لغوي واحد. وتحتفظ التجميعات الخاصة بمصدر معيّن والعينات غير المربوطة بمعرّفات منفصلة. والظهور المتكرر في المخطط إحالة إلى السجل نفسه، وليس لغة جديدة."
    this_is_not_every_published: "هذه ليست كل الأشجار المنشورة في العالم. لم تُدمج التراتبية الكاملة المملوكة لـ Ethnologue، ولا كل الدراسات الإقليمية، ولا كل المقترحات التاريخية، ولا ببليوغرافيات الفهارس، ولا مراجعة كاملة لكل تعارض بحثًا بحثًا. والعقدة التي لا يظهر لها بديل لم يُشهد لها بالإجماع."
    every_assertion_retains_its_source: "يحتفظ كل ادعاء بمصدره. تبقى تصنيفات الفهارس، وشجرات النشوء القائمة على السمات المعجمية، ومجموعات الأبجديات اليدوية، والتأثير الخطي، واستعمال أنظمة الكتابة منفصلة. وعبارة «حُذفت المراحل الوسيطة» تعني ادعاءً عامًا بالانحدار التاريخي، لا أصلًا مباشرًا. وجذور الدراسات وفئات الفهارس مداخل للتنقل، وليست سلفًا واحدًا مختلقًا."
    glottolog_provides_the_navigation_backbone: "يوفر Glottolog الهيكل الأساسي للتنقل. وتُدمج الفروع البديلة من WALS والدراسات تحت سلفها المشترك متى أمكن. هذا الربط للتنقل، وليس ادعاءً جديدًا في الأنساب. وتبقى الأشجار الممتدة عبر عدة أسر أو المجموعات الخارجية في قسم تنقل منفصل."
    language_details_query_the_public: "عند فتح تفاصيل لغة، يُستعلَم عند الطلب من واجهة Hugging Face Hub البرمجية العامة. تتطلب النتائج تطابقًا تامًا في بيانات اللغة الوصفية في بطاقة النموذج مع رمز ISO الخاص بالسجل ومقابله الموثَّق ذي الحرفين. ولا يُستنتج دعم اللغة الأم أو اللغة الكبرى للهجات أو اللغات المفردة. قد تظهر نماذج متعددة اللغات. البيانات الوصفية يقدمها الناشر، ولا تضمن الجودة ولا الدعم الحصري للغة ولا تغطية اللهجات. القائمة عينة محدودة مرتبة حسب عدد التنزيلات، مع روابط إلى كل نتائج Hub. تُجلب بيانات النماذج مباشرةً، ولا تدخل في تصدير التصنيف بصيغتي XML/OPML."
    xml_and_json_contain_every: "يحتوي XML وJSON على كل سجل وادعاء وملاحظة ومصدر وبيان استخدام ومجموع تحقق للمدخلات. وOPML مخطط بإحالات متكررة لادعاءات التصنيف والتاريخ؛ ولا يتضمن البيانات الوصفية الكاملة ولا جدول استخدام CLDR. وتظل حقوق كل مصدر سارية: Glottolog CC BY 4.0، وSIL CC BY-SA 4.0، وPower CLDF GPL-3.0، وبيانات Unicode وفق شروط Unicode."
    sil_index_rows_exact_iso: "صفوف فهرس SIL. المطابقات التامة لرمز ISO تشترك في السجلات؛ وتبقى معرّفات SIL المحلية منفصلة."
    all_glottolog_alias_rows_for: "حُفظت كل صفوف الأسماء البديلة في Glottolog لفئة لغات الإشارة مع وسوم مزوديها. واحتُفظ بتسميات ISO الإنجليزية والفرنسية وأسماء SIL. تظهر الأسماء الموثقة باللغة نفسها حيث وُجدت. تعرض عينات الحروف من UCD محارف، لا الاسم الذاتي للكتابة. ولم تُختلق أسماء ذاتية بالفيديو أو بتدوين الإشارة."
    all_sources_appear_together_repeated: "تظهر كل المصادر معًا. الفروع المتكررة إحالات إلى معرّفات مشتركة. تُعرض الروايات البديلة عن الأصل في تفاصيل السجل مع روابط؛ والادعاءات المبدئية موسومة. الشجرتان الأوروبيتان التوافقيتان تحليلان مستقلان للدراسة نفسها، وليستا منشورين. ولم تُستورد شجرة لكل لغات الإشارة."
    top_level_entries_of_glottolog: "مداخل المستوى الأعلى في Glottolog 5.3. لكل سجل صفحته الخاصة على عنوان URL يتبع تصنيفه."
    individual_source_citations_and_licenses: ": الاستشهادات والتراخيص الخاصة بكل مصدر أدناه. تُنسب الأشجار الموجزة المستوردة إلى مؤلفيها والقائمين عليها. مقابلات الرموز:"
    consult_each_original_source_before: ". راجع كل مصدر أصلي قبل أي إعادة توزيع."

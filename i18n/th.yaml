    independent_families_and_isolates_are: "ตระกูลที่เป็นอิสระและภาษาโดดเดี่ยวเป็นรากที่ขนานกัน ขยายแต่ละสาขาเพื่อติดตามการจัดจำแนกที่บันทึกไว้"
    click_a_row_to_expand: "คลิกแถวเพื่อขยายและตรวจดู เลือกภาษาเพื่อเปรียบเทียบตำแหน่งตามแต่ละแหล่งข้อมูลกับทางเลือกที่เชื่อมกับบทความ สาขาของงานวิจัยขยายได้ในโครงร่างเดียวกัน"
    expand_a_row_to_follow: "ขยายแถวเพื่อติดตามสาขา เลือก “รายละเอียด” เพื่อดูตำแหน่งและการอ้างอิงทั้งหมด ชื่อที่ซ้ำกันหมายถึงระเบียนเดียวกัน"
    each_placement_says_according_to: "ทุกตำแหน่งระบุว่า “ตาม [แหล่งข้อมูล]” และลิงก์ไปยังบทความหรือบัญชีรายชื่อ การจัดจำแนกของบัญชีรายชื่อไม่ได้ถูกแสดงว่าเป็นบทความวิจัยแต่ละชิ้น"
    different_parent_names_alone_do: "การที่ชื่อระดับสูงกว่าต่างกันเพียงอย่างเดียวไม่ได้พิสูจน์ว่าขัดแย้ง สำหรับแผนภูมิต้นไม้จากงานวิจัยแต่ละคู่ แผนที่นี้เปรียบเทียบเคลดที่จำกัดอยู่ที่ ID ภาษาตัวอย่างที่ตรงกันอย่างน้อยสามรายการ เคลดที่ตัดกันและไม่ซ้อนกันจะถูกทำเครื่องหมายว่าไม่สอดคล้องกันทางทอพอโลยี"
    different_sampling_unresolved_polytomies_and: "การสุ่มตัวอย่างที่ต่างกัน การแตกแขนงหลายทางที่ยังไม่คลี่คลาย และการจับคู่ซ้ำของวิธภาษาท้องถิ่นที่ต่างกัน ไม่ได้เป็นหลักฐานของบรรพบุรุษที่ขัดแย้งกันในตัวเอง ID ปลายที่ซ้ำหรือซ้อนกันจะไม่ถูกนำมาเปรียบเทียบอัตโนมัติ"
    a_conflicting_summary_topology_does: "ทอพอโลยีสรุปที่ขัดแย้งกันไม่ได้ตัดสินว่าข้อกล่าวอ้างทางวิทยาศาสตร์ใดถูกต้อง ยังไม่ได้ตรวจสอบความไม่แน่นอนภายหลังและการวิเคราะห์ทั้งหมดในแต่ละบทความ"
    a_script_is_not_a: "อักษรไม่ใช่ตระกูลภาษา การสืบเชื้อสายทางประวัติศาสตร์ อิทธิพลทางรูปอักษร และการใช้ในภาษาเป็นคนละเรื่องกัน การไม่มีบรรพบุรุษหมายถึงยังไม่ได้ตรวจสอบ ไม่ใช่หลักฐานว่าคิดค้นขึ้นอย่างอิสระ"
    a_shared_writing_system_or: "การใช้ระบบการเขียนหรือตัวอักษรนิ้วมือร่วมกันไม่ได้พิสูจน์ว่าภาษามีบรรพบุรุษเดียวกัน"
    all_imported_historical_and_influence: "ข้อกล่าวอ้างด้านประวัติศาสตร์และอิทธิพลที่นำเข้าทั้งหมดแสดงไว้ด้วยกัน แต่ละเส้นมีแหล่งข้อมูลและระดับความไม่แน่นอนกำกับ"
    glottolog_classifications_lexical_feature_study: "การจัดจำแนกของ Glottolog แผนภูมิต้นไม้จากงานวิจัยตามลักษณะทางคำศัพท์ และกลุ่มตัวอักษรนิ้วมือใช้ระเบียนร่วมกัน แต่แยกหลักฐานไว้ต่างหาก หมวดสำหรับการนำทางไม่ใช่บรรพบุรุษร่วม"
    source_specific_sampled_clades_share: "เคลดตัวอย่างของแต่ละแหล่งข้อมูลใช้ระเบียนภาษาเดียวกัน การวิเคราะห์ยุโรปสองชุดเป็นการทำซ้ำของงานวิจัยเดียวกัน"
    historical_descent_graphic_influence_sample: "การสืบเชื้อสายทางประวัติศาสตร์ อิทธิพลทางรูปอักษร ความเป็นตัวอย่างเดียวกัน และการใช้อักษร เป็นความสัมพันธ์คนละแบบ ไม่ได้อ้างถึงบรรพบุรุษร่วมระดับโลก"
    these_records_remain_searchable_and: "ระเบียนเหล่านี้ยังค้นหาและตรวจดูได้ การไม่แสดงความเชื่อมโยงไม่ได้เป็นการอ้างว่ามีต้นกำเนิดที่เป็นอิสระ"
    standard_chapters_are_sections_of: "บทต่าง ๆ ของมาตรฐานเป็นส่วนของสิ่งพิมพ์เดียว ไม่ใช่งานวิจัยที่เป็นอิสระ รายการอ้างอิงทางบรรณานุกรมแยกจากชุดข้อมูลที่นำเข้า"
    the_transeurasian_paper_level_debate: "การโต้แย้งระหว่างบทความเรื่องสมมติฐานทรานส์ยูเรเชียรวมถึงข้อเสนอ คำวิจารณ์ และการตอบโต้ ซึ่งแยกจากการเปรียบเทียบทอพอโลยีอัตโนมัติ"
    these_summary_clades_cannot_both: "เคลดสรุปเหล่านี้ไม่อาจเป็นจริงพร้อมกันบนปลายตัวอย่างที่ใช้ร่วมกัน ข้อนี้ไม่ได้ตัดสินว่างานวิจัยใดถูกต้อง ตัวอย่างด้านล่างอาจเกี่ยวกับกลุ่มที่กว้างกว่าซึ่งรวมระเบียนนี้อยู่"
    this_atlas_preserves_every_imported: "แผนที่นี้เก็บข้อกล่าวอ้างการจัดจำแนกที่นำเข้าทุกข้อพร้อมแหล่งข้อมูล รายการที่ Glottocode ตรงกันทุกประการใช้ระเบียนภาษาเดียวกัน กลุ่มเฉพาะของแหล่งข้อมูลและตัวอย่างที่ยังไม่ได้จับคู่ยังคงมี ID แยกกัน การปรากฏซ้ำในโครงร่างเป็นการอ้างถึงระเบียนเดียวกัน ไม่ใช่ภาษาใหม่"
    this_is_not_every_published: "นี่ไม่ใช่แผนภูมิต้นไม้ทั้งหมดที่ตีพิมพ์ในโลก ไม่ได้รวมลำดับชั้นฉบับสมบูรณ์ที่มีลิขสิทธิ์ของ Ethnologue เอกสารเฉพาะเรื่องระดับภูมิภาคทั้งหมด ข้อเสนอทางประวัติศาสตร์ทั้งหมด บรรณานุกรมของบัญชีรายชื่อ และการตรวจสอบความขัดแย้งทุกข้อทีละบทความ จุดที่ไม่แสดงทางเลือกอื่นยังไม่ได้รับการรับรองว่าเป็นฉันทามติ"
    every_assertion_retains_its_source: "ข้อกล่าวอ้างทุกข้อเก็บแหล่งข้อมูลไว้ การจัดจำแนกของบัญชีรายชื่อ วิวัฒนาการชาติพันธุ์ตามลักษณะทางคำศัพท์ กลุ่มตัวอักษรนิ้วมือ อิทธิพลทางรูปอักษร และการใช้ระบบการเขียน แยกจากกัน “ละขั้นกลาง” หมายถึงข้อกล่าวอ้างกว้าง ๆ เรื่องการสืบเชื้อสายทางประวัติศาสตร์ ไม่ใช่ต้นสายโดยตรง รากของงานวิจัยและหมวดของบัญชีรายชื่อเป็นรายการสำหรับการนำทาง ไม่ใช่บรรพบุรุษเดียวที่สร้างขึ้น"
    glottolog_provides_the_navigation_backbone: "Glottolog เป็นโครงหลักของการนำทาง สาขาอื่นจาก WALS และงานวิจัยถูกใส่ไว้ใต้บรรพบุรุษร่วมเมื่อทำได้ การเชื่อมนี้มีไว้เพื่อการนำทาง ไม่ใช่ข้อกล่าวอ้างทางวงศ์วานใหม่ แผนภูมิต้นไม้ที่ข้ามหลายตระกูลหรือเป็นกลุ่มนอกอยู่ในส่วนการนำทางแยกต่างหาก"
    language_details_query_the_public: "เมื่อเปิดรายละเอียดภาษา ระบบจะสอบถาม API สาธารณะของ Hugging Face Hub ตามต้องการ ผลลัพธ์ต้องมีข้อมูลภาษาในการ์ดโมเดลตรงกันทุกประการกับรหัส ISO ของระเบียนนั้นและรหัสสองตัวอักษรที่ตรงกันซึ่งมีเอกสารรับรอง ไม่อนุมานการรองรับภาษาแม่หรือภาษามหภาคไปยังภาษาถิ่นหรือภาษาเดี่ยว อาจมีโมเดลหลายภาษาปรากฏ ข้อมูลมาจากผู้เผยแพร่และไม่รับประกันคุณภาพ การรองรับเฉพาะภาษานั้น หรือการครอบคลุมภาษาถิ่น รายการนี้เป็นตัวอย่างจำนวนจำกัดที่เรียงตามยอดดาวน์โหลด พร้อมลิงก์ไปยังผลลัพธ์ทั้งหมดใน Hub ข้อมูลโมเดลดึงมาแบบสดและไม่รวมอยู่ในไฟล์ส่งออก XML/OPML ของการจัดจำแนก"
    xml_and_json_contain_every: "XML และ JSON มีทุกระเบียน ข้อกล่าวอ้าง หมายเหตุ แหล่งข้อมูล ข้อมูลการใช้ และค่าตรวจสอบของข้อมูลนำเข้า OPML เป็นโครงร่างของข้อกล่าวอ้างด้านการจัดจำแนกและประวัติศาสตร์ที่อ้างถึงซ้ำ ไม่รวมข้อมูลทั้งหมดหรือตารางการใช้ของ CLDR สิทธิ์ของแต่ละแหล่งข้อมูลยังคงมีผล: Glottolog CC BY 4.0, SIL CC BY-SA 4.0, Power CLDF GPL-3.0, ข้อมูล Unicode ตามเงื่อนไขของ Unicode"
    sil_index_rows_exact_iso: "แถวในดัชนีของ SIL รายการที่รหัส ISO ตรงกันทุกประการใช้ระเบียนร่วมกัน ตัวระบุเฉพาะของ SIL ยังคงแยกกัน"
    all_glottolog_alias_rows_for: "แถวชื่ออื่นของ Glottolog ในหมวดภาษามือทั้งหมดถูกเก็บไว้พร้อมป้ายของผู้ให้ข้อมูล ชื่อภาษาอังกฤษและภาษาฝรั่งเศสของ ISO และชื่อของ SIL ยังคงอยู่ ชื่อในภาษานั้นเองที่ตรวจสอบแล้วจะแสดงเมื่อมี ตัวอย่างรูปอักษรของ UCD แสดงตัวอักขระ ไม่ใช่ชื่อที่อักษรนั้นเรียกตนเอง ไม่ได้สร้างชื่อเรียกตนเองในรูปวิดีโอหรือสัญกรณ์ภาษามือขึ้นเอง"
    all_sources_appear_together_repeated: "แหล่งข้อมูลทั้งหมดแสดงไว้ด้วยกัน สาขาที่ซ้ำเป็นการอ้างถึง ID ที่ใช้ร่วมกัน คำอธิบายอื่นเรื่องต้นกำเนิดแสดงในรายละเอียดระเบียนพร้อมลิงก์ ข้อกล่าวอ้างชั่วคราวมีป้ายกำกับ แผนภูมิต้นไม้ฉันทามติยุโรปทั้งสองเป็นการวิเคราะห์อิสระของงานวิจัยเดียวกัน ไม่ใช่สิ่งพิมพ์สองชิ้น ไม่ได้นำเข้าแผนภูมิต้นไม้ที่รวมภาษามือทั้งหมด"
    top_level_entries_of_glottolog: "รายการระดับบนสุดของ Glottolog 5.3 ทุกระเบียนมีหน้าของตนเองที่ URL ซึ่งเป็นไปตามการจัดจำแนก"
    individual_source_citations_and_licenses: ": การอ้างอิงและสัญญาอนุญาตของแต่ละแหล่งข้อมูลอยู่ด้านล่าง แผนภูมิต้นไม้สรุปที่นำเข้าเป็นผลงานของผู้เขียนและผู้ดูแล การเทียบรหัส:"

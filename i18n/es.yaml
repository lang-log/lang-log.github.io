    classification_and_names_from: "Clasificación y nombres de"
    used_under: ", con licencia"
    this_is_coverage_of_the: "Esta es la cobertura del corpus importado, no de todas las publicaciones del mundo."
    coverage_is_limited_to_the: "La cobertura se limita a las fuentes importadas. Que no se muestre ninguna alternativa no implica consenso."
    catalog_completeness_is_measured_against: "La completitud del catálogo se mide respecto a las versiones importadas. La cobertura de la investigación es parcial, y la ausencia de ramas no implica acuerdo."
    branches_are_conditional_on_their: "Las ramas dependen de su fuente. Las distintas ubicaciones aparecen juntas; no hace falta cambiar de fuente."
    independent_families_and_isolates_are: "Las familias independientes y las lenguas aisladas son raíces paralelas. Despliegue cada rama para seguir su clasificación registrada."
    click_a_row_to_expand: "Haga clic en una fila para desplegarla y examinarla. Seleccione una lengua para comparar sus ubicaciones según cada fuente y las alternativas vinculadas a artículos. Despliegue una rama de un estudio dentro del mismo esquema."
    expand_a_row_to_follow: "Despliegue una fila para seguir sus ramas. Seleccione «Detalles» para ver todas las ubicaciones y citas. Los nombres repetidos remiten al mismo registro."
    each_placement_says_according_to: "Cada ubicación indica «Según [fuente]» y enlaza con su artículo o catálogo. Las clasificaciones de catálogo no se presentan como artículos de investigación individuales."
    different_parent_names_alone_do: "Que los nombres superiores sean distintos no prueba por sí solo un conflicto. Para cada par de árboles de estudios, el atlas compara clados restringidos a al menos tres identificadores de lengua muestreados idénticos. Los clados que se cruzan sin anidarse se marcan como topológicamente incompatibles."
    different_sampling_unresolved_polytomies_and: "Un muestreo distinto, las politomías no resueltas y la asignación repetida de distintas variedades locales no son, por sí solos, prueba de una ascendencia en conflicto. Los identificadores terminales repetidos o anidados se excluyen de la comparación automática de conflictos."
    a_conflicting_summary_topology_does: "Una topología resumida en conflicto no determina qué afirmación científica es correcta. No se han revisado la incertidumbre posterior ni todos los análisis de cada artículo."
    a_script_is_not_a: "Una escritura no es una familia de lenguas. La descendencia histórica, la influencia gráfica y el uso por las lenguas son cosas distintas; la falta de ascendencia significa que no se ha revisado, no que sea prueba de una invención independiente."
    a_shared_writing_system_or: "Compartir un sistema de escritura o un alfabeto manual no prueba que las lenguas tengan un antepasado común."
    all_imported_historical_and_influence: "Todas las afirmaciones importadas sobre historia e influencia aparecen juntas; cada línea lleva su fuente y su grado de incertidumbre."
    glottolog_classifications_lexical_feature_study: "Las clasificaciones de Glottolog, los árboles de estudios por rasgos léxicos y los grupos de alfabetos manuales comparten identidades, pero mantienen separada su evidencia. Las categorías de navegación no son antepasados universales."
    source_specific_sampled_clades_share: "Los clados muestreados de cada fuente comparten las mismas identidades de lengua. Los dos análisis europeos son réplicas de un mismo estudio."
    historical_descent_graphic_influence_sample: "La descendencia histórica, la influencia gráfica, la identidad de las muestras y el uso de la escritura son relaciones distintas. No se afirma ningún antepasado común global."
    these_records_remain_searchable_and: "Estos registros se pueden buscar y examinar. Que no se muestre ninguna conexión no es una afirmación de origen independiente."
    standard_chapters_are_sections_of: "Los capítulos de la norma son secciones de una sola publicación, no estudios independientes. Las referencias bibliográficas se distinguen de los conjuntos de datos importados."
    the_transeurasian_paper_level_debate: "El debate transeuroasiático entre artículos incluye propuesta, crítica y respuesta. Esto es distinto de la comparación automática de topologías."
    these_summary_clades_cannot_both: "Estos clados resumidos no pueden cumplirse a la vez sobre los terminales muestreados comunes. Esto no determina qué estudio es correcto. Los ejemplos de abajo pueden afectar a un grupo más amplio que contiene este registro."
    this_atlas_preserves_every_imported: "Este atlas conserva cada afirmación de clasificación importada junto con su fuente. Las coincidencias exactas de Glottocode comparten un único registro de lengua. Las agrupaciones propias de una fuente y las muestras sin correspondencia mantienen identificadores separados. Una aparición repetida en el esquema es una referencia al mismo registro, no una lengua nueva."
    this_is_not_every_published: "Esto no reúne todos los árboles publicados en el mundo. No se han incorporado la jerarquía completa y privativa de Ethnologue, todas las monografías regionales, todas las propuestas históricas, las bibliografías de los catálogos ni una revisión completa, artículo por artículo, de cada conflicto. Un nodo sin alternativas mostradas no se ha certificado como consenso."
    every_assertion_retains_its_source: "Cada afirmación conserva su fuente. Las clasificaciones de catálogo, las filogenias por rasgos léxicos, los grupos de alfabetos manuales, la influencia gráfica y el uso de sistemas de escritura se mantienen separados. «Etapas intermedias omitidas» indica una afirmación general de descendencia histórica, no un progenitor inmediato. Las raíces de los estudios y las categorías de los catálogos son entradas de navegación, no un único antepasado inventado."
    glottolog_provides_the_navigation_backbone: "Glottolog proporciona la estructura de navegación. Las ramas alternativas de WALS y de los estudios se integran, cuando es posible, bajo su antepasado común. Esta conexión sirve para navegar y no es una nueva afirmación genealógica. Los árboles que abarcan varias familias o grupos externos se mantienen en una sección de navegación aparte."
    language_details_query_the_public: "Los detalles de una lengua consultan bajo demanda la API pública de Hugging Face Hub. Los resultados exigen una coincidencia exacta en los metadatos de lengua de la ficha del modelo con el código ISO del propio registro y su equivalente documentado de dos letras. No se deduce para dialectos ni lenguas individuales el soporte de la lengua superior o de la macrolengua. Pueden aparecer modelos multilingües. Los metadatos los aporta quien publica el modelo y no garantizan la calidad, el soporte exclusivo de una lengua ni la cobertura de dialectos. La lista es una muestra limitada ordenada por descargas, con enlaces a todos los resultados del Hub. Los metadatos de los modelos se obtienen en el momento y no se incluyen en las exportaciones XML/OPML de la clasificación."
    xml_and_json_contain_every: "XML y JSON contienen cada registro, afirmación, nota, fuente, dato de uso y suma de verificación de entrada. OPML es un esquema de referencias repetidas con las afirmaciones de clasificación e historia; no incluye todos los metadatos ni la tabla de uso de CLDR. Siguen vigentes los derechos de cada fuente: Glottolog CC BY 4.0, SIL CC BY-SA 4.0, Power CLDF GPL-3.0, datos de Unicode según las condiciones de Unicode."
    sil_index_rows_exact_iso: "Filas del índice de SIL. Las coincidencias exactas de código ISO comparten registro; los identificadores propios de SIL se mantienen aparte."
    all_glottolog_alias_rows_for: "Todas las filas de alias de Glottolog de la categoría de lenguas de señas se conservan con las etiquetas de su proveedor. Se mantienen las denominaciones ISO en inglés y francés y los nombres de SIL. Los nombres verificados en la propia lengua aparecen cuando existen. Las muestras de glifos del UCD muestran caracteres, no el nombre propio de una escritura. No se han inventado autodenominaciones en vídeo ni en notación de señas."
    all_sources_appear_together_repeated: "Todas las fuentes aparecen juntas. Las ramas repetidas son referencias a identificadores compartidos. Las propuestas alternativas sobre el origen se muestran en los detalles del registro con enlaces; las afirmaciones provisionales están señaladas. Los dos árboles de consenso europeos son análisis independientes del mismo estudio, no dos publicaciones. No se ha importado ningún árbol de todas las lenguas de señas."
    top_level_entries_of_glottolog: "Entradas de nivel superior de Glottolog 5.3. Cada registro tiene su propia página en una URL que sigue su clasificación."
    individual_source_citations_and_licenses: ": citas y licencias de cada fuente más abajo. Los árboles resumidos importados se atribuyen a sus autores y responsables. Equivalencias de códigos:"
    consult_each_original_source_before: ". Consulte cada fuente original antes de redistribuir los datos."

    this_is_coverage_of_the: "यह आयात किए गए कॉर्पस का दायरा है, दुनिया के सभी प्रकाशनों का नहीं।"
    coverage_is_limited_to_the: "दायरा आयात किए गए स्रोतों तक सीमित है। कोई वैकल्पिक मत न दिखने का अर्थ सहमति नहीं है।"
    catalog_completeness_is_measured_against: "सूचियों की पूर्णता आयात किए गए संस्करणों के आधार पर मापी जाती है। शोध का समावेश आंशिक है, और शाखाओं का न होना सहमति नहीं दर्शाता।"
    branches_are_conditional_on_their: "शाखाएँ अपने स्रोत पर निर्भर हैं। भिन्न स्थान साथ-साथ दिखते हैं; स्रोत बदलने की आवश्यकता नहीं है।"
    independent_families_and_isolates_are: "स्वतंत्र भाषा-परिवार और पृथक भाषाएँ समानांतर मूल हैं। दर्ज वर्गीकरण देखने के लिए हर शाखा खोलें।"
    click_a_row_to_expand: "किसी पंक्ति को खोलकर देखने के लिए उस पर क्लिक करें। किसी भाषा के स्रोत-वार स्थानों और शोधपत्रों से जुड़े वैकल्पिक मतों की तुलना के लिए उसे चुनें। अध्ययन-शाखाएँ भी उसी रूपरेखा में खुलती हैं।"
    expand_a_row_to_follow: "शाखाएँ देखने के लिए कोई पंक्ति खोलें। सभी स्थानों और उद्धरणों के लिए “विवरण” चुनें। दोहराए गए नाम एक ही रिकॉर्ड को दर्शाते हैं।"
    each_placement_says_according_to: "हर स्थान पर “स्रोत: [स्रोत]” लिखा होता है और उसके शोधपत्र या सूची का लिंक होता है। सूचियों के वर्गीकरण को अलग शोधपत्र के रूप में नहीं दिखाया जाता।"
    different_parent_names_alone_do: "केवल उच्चतर नामों का भिन्न होना विरोध सिद्ध नहीं करता। अध्ययन-वृक्षों के हर जोड़े के लिए एटलस केवल उन शाखाओं की तुलना करता है जिनमें कम से कम तीन समान नमूना-भाषा ID हों। एक-दूसरे को काटने वाली, अंतर्निहित न होने वाली शाखाओं को संरचना की दृष्टि से असंगत चिह्नित किया जाता है।"
    different_sampling_unresolved_polytomies_and: "भिन्न नमूने, अनसुलझे बहु-विभाजन और विभिन्न स्थानीय रूपों का बार-बार मिलान अपने-आप में विरोधी वंश का साक्ष्य नहीं हैं। दोहराए गए या अंतर्निहित अंतिम ID स्वचालित तुलना से बाहर रखे जाते हैं।"
    a_conflicting_summary_topology_does: "सारांश-संरचना में विरोध से यह तय नहीं होता कि कौन-सा वैज्ञानिक दावा सही है। पश्च अनिश्चितता और हर शोधपत्र के सभी विश्लेषणों की समीक्षा नहीं की गई है।"
    a_script_is_not_a: "लिपि कोई भाषा-परिवार नहीं है। ऐतिहासिक वंश, आकृति-संबंधी प्रभाव और भाषाओं में उपयोग अलग-अलग बातें हैं; पूर्वज न होने का अर्थ है कि समीक्षा नहीं हुई, यह स्वतंत्र आविष्कार का प्रमाण नहीं है।"
    a_shared_writing_system_or: "एक ही लेखन-प्रणाली या हस्त-वर्णमाला का उपयोग भाषाओं के साझा वंश का प्रमाण नहीं है।"
    all_imported_historical_and_influence: "इतिहास और प्रभाव के आयात किए गए सभी दावे साथ दिखते हैं; हर रेखा के साथ उसका स्रोत और अनिश्चितता दी गई है।"
    glottolog_classifications_lexical_feature_study: "Glottolog के वर्गीकरण, शाब्दिक विशेषताओं पर आधारित अध्ययन-वृक्ष और हस्त-वर्णमाला समूह एक ही रिकॉर्ड साझा करते हैं, पर अपने साक्ष्य अलग रखते हैं। नेविगेशन-श्रेणियाँ सार्वभौमिक पूर्वज नहीं हैं।"
    source_specific_sampled_clades_share: "हर स्रोत की नमूना-शाखाएँ एक ही भाषा-रिकॉर्ड साझा करती हैं। दो यूरोपीय विश्लेषण एक ही अध्ययन की पुनरावृत्तियाँ हैं।"
    historical_descent_graphic_influence_sample: "ऐतिहासिक वंश, आकृति-संबंधी प्रभाव, नमूने की पहचान और लिपि का उपयोग अलग-अलग संबंध हैं। किसी वैश्विक साझा पूर्वज का दावा नहीं किया गया है।"
    these_records_remain_searchable_and: "ये रिकॉर्ड खोजे और देखे जा सकते हैं। कोई संबंध न दिखना स्वतंत्र उत्पत्ति का दावा नहीं है।"
    standard_chapters_are_sections_of: "मानक के अध्याय एक ही प्रकाशन के खंड हैं, स्वतंत्र अध्ययन नहीं। ग्रंथ-संदर्भों को आयात किए गए डेटासेट से अलग रखा गया है।"
    the_transeurasian_paper_level_debate: "ट्रांसयूरेशियाई परिकल्पना पर शोधपत्रों की बहस में प्रस्ताव, आलोचना और उत्तर शामिल हैं। यह संरचनाओं की स्वचालित तुलना से अलग है।"
    these_summary_clades_cannot_both: "ये सारांश-शाखाएँ साझा नमूना-छोरों पर एक साथ सही नहीं हो सकतीं। इससे यह तय नहीं होता कि कौन-सा अध्ययन सही है। नीचे के उदाहरण इस रिकॉर्ड वाले किसी बड़े समूह से संबंधित हो सकते हैं।"
    this_atlas_preserves_every_imported: "यह एटलस आयात किए गए हर वर्गीकरण-दावे को उसके स्रोत के साथ सुरक्षित रखता है। Glottocode के पूर्ण मिलान वाले प्रविष्टियाँ एक ही भाषा-रिकॉर्ड साझा करती हैं। स्रोत-विशिष्ट समूह और बिना मिलान वाले नमूने अलग ID रखते हैं। रूपरेखा में बार-बार आना उसी रिकॉर्ड का संदर्भ है, नई भाषा नहीं।"
    this_is_not_every_published: "ये दुनिया में प्रकाशित सभी वृक्ष नहीं हैं। Ethnologue का पूरा स्वामित्व वाला पदानुक्रम, सभी क्षेत्रीय मोनोग्राफ, सभी ऐतिहासिक प्रस्ताव, सूचियों की ग्रंथसूचियाँ और हर विरोध की शोधपत्र-दर-शोधपत्र पूरी समीक्षा शामिल नहीं हैं। जिस बिंदु पर कोई वैकल्पिक मत नहीं दिखता, उसे सहमति के रूप में प्रमाणित नहीं किया गया है।"
    every_assertion_retains_its_source: "हर दावा अपना स्रोत बनाए रखता है। सूचियों के वर्गीकरण, शाब्दिक विशेषताओं पर आधारित वंशवृक्ष, हस्त-वर्णमाला समूह, आकृति-संबंधी प्रभाव और लेखन-प्रणालियों का उपयोग अलग रखे जाते हैं। “बीच के चरण छोड़े गए” का अर्थ ऐतिहासिक वंश का सामान्य दावा है, सीधा जनक नहीं। अध्ययनों के मूल और सूचियों की श्रेणियाँ नेविगेशन-प्रविष्टियाँ हैं, कोई गढ़ा हुआ एकल पूर्वज नहीं।"
    glottolog_provides_the_navigation_backbone: "Glottolog नेविगेशन का ढाँचा है। WALS और अध्ययनों की वैकल्पिक शाखाएँ, जहाँ संभव हो, उनके साझा पूर्वज के नीचे रखी जाती हैं। यह जोड़ नेविगेशन के लिए है, कोई नया वंश-दावा नहीं। कई भाषा-परिवारों या बाहरी समूहों वाले वृक्ष एक अलग नेविगेशन-खंड में रहते हैं।"
    language_details_query_the_public: "भाषा का विवरण खोलने पर आवश्यकता के अनुसार सार्वजनिक Hugging Face Hub API से पूछताछ की जाती है। परिणामों के लिए मॉडल-कार्ड की भाषा-जानकारी का रिकॉर्ड के अपने ISO कोड और उसके प्रलेखित दो-अक्षरी समकक्ष से पूर्ण मिलान आवश्यक है। बोलियों या अलग भाषाओं के लिए मूल भाषा या वृहद् भाषा का समर्थन अनुमानित नहीं किया जाता। बहुभाषी मॉडल भी दिख सकते हैं। जानकारी प्रकाशक द्वारा दी गई है और गुणवत्ता, केवल उसी भाषा के समर्थन या बोलियों के समावेश की गारंटी नहीं देती। सूची डाउनलोड के क्रम में एक सीमित नमूना है, जिसमें Hub के सभी परिणामों के लिंक हैं। मॉडल-जानकारी सीधे प्राप्त की जाती है और वर्गीकरण के XML/OPML निर्यात में शामिल नहीं है।"
    xml_and_json_contain_every: "XML और JSON में हर रिकॉर्ड, दावा, टिप्पणी, स्रोत, उपयोग-प्रविष्टि और इनपुट चेकसम है। OPML वर्गीकरण और इतिहास के दावों की बार-बार संदर्भ वाली रूपरेखा है; इसमें पूरी जानकारी या CLDR उपयोग-तालिका नहीं है। हर स्रोत के अधिकार लागू रहते हैं: Glottolog CC BY 4.0, SIL CC BY-SA 4.0, Power CLDF GPL-3.0, Unicode डेटा Unicode की शर्तों के अंतर्गत।"
    sil_index_rows_exact_iso: "SIL अनुक्रमणिका की पंक्तियाँ। ISO कोड के पूर्ण मिलान वाले रिकॉर्ड साझा करते हैं; SIL के अपने पहचानकर्ता अलग रहते हैं।"
    all_glottolog_alias_rows_for: "सांकेतिक भाषा श्रेणी के लिए Glottolog की सभी उपनाम-पंक्तियाँ उनके प्रदाता-टैग के साथ सुरक्षित हैं। ISO के अंग्रेज़ी और फ़्रांसीसी नाम तथा SIL के नाम बनाए रखे गए हैं। स्वयं उस भाषा में सत्यापित नाम, जहाँ उपलब्ध हों, दिखाए जाते हैं। UCD के ग्लिफ़-नमूने वर्ण दिखाते हैं, किसी लिपि का स्वनाम नहीं। वीडियो या संकेत-लेखन में स्वनाम गढ़े नहीं गए हैं।"
    all_sources_appear_together_repeated: "सभी स्रोत साथ दिखते हैं। दोहराई गई शाखाएँ साझा ID के संदर्भ हैं। उत्पत्ति के वैकल्पिक मत रिकॉर्ड-विवरण में लिंक के साथ दिखाए जाते हैं; अस्थायी दावे चिह्नित हैं। दो यूरोपीय सहमति-वृक्ष एक ही अध्ययन के स्वतंत्र विश्लेषण हैं, दो प्रकाशन नहीं। सभी सांकेतिक भाषाओं का कोई वृक्ष आयात नहीं किया गया है।"
    top_level_entries_of_glottolog: "Glottolog 5.3 की सर्वोच्च स्तर की प्रविष्टियाँ। हर रिकॉर्ड का अपना पृष्ठ है, जिसका URL उसके वर्गीकरण के अनुसार है।"
    individual_source_citations_and_licenses: ": हर स्रोत के उद्धरण और लाइसेंस नीचे हैं। आयात किए गए सारांश-वृक्ष उनके लेखकों और संरक्षकों के नाम हैं। कोड-समकक्षताएँ:"
    consult_each_original_source_before: "। आगे वितरित करने से पहले हर मूल स्रोत देख लें।"
    classification: "वर्गीकरण ·"
    name_search_is_exploratory_results: "नाम से खोज केवल टटोलने के लिए है; परिणाम सत्यापित मिलान नहीं हैं।"
    selected_historical_relationships_reviewed_chapter: "चुने हुए ऐतिहासिक संबंधों की समीक्षा की गई है; अध्यायों के खंड स्वतंत्र अध्ययन नहीं गिने जाते।"
    all_language_sample_rows_and: "सभी भाषा / नमूना पंक्तियाँ और प्रकाशित उपसमूह-जानकारी; यह शोधपत्र के जालीदार नेटवर्क का पुनर्निर्माण नहीं है।"
    all_explicit_script_entries_under: "languageData में लिपियों की सभी स्पष्ट प्रविष्टियाँ। प्राथमिक / द्वितीयक भेद बनाए रखा गया है। यह दुनिया की वर्तनियों की पूरी सूची नहीं है; कोई भाषा-वंशावली अनुमानित नहीं की गई।"
    complete_imports_of_the_identified: "पहचाने गए सूची-संस्करणों का पूरा आयात, दुनिया की सभी भाषाओं या लिपियों की पूरी सूची नहीं।"

    selected_historical_relationships_reviewed_chapter: "Seçilmiş bazı tarihsel ilişkiler incelendi; bölüm kısımları bağımsız çalışma sayılmaz."
    all_language_sample_rows_and: "Tüm dil ve örnek satırları ile yayımlanmış alt grup bilgileri; makaledeki ağ yapısının yeniden kurulması değildir."
    all_explicit_script_entries_under: "languageData altındaki tüm açık yazı kayıtları. Birincil / ikincil ayrımı korunur. Dünyadaki yazımların eksiksiz bir dökümü değildir; dil soyu çıkarılmaz."

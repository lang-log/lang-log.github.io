    different_sampling_unresolved_polytomies_and: "Farklı örnekleme, çözülmemiş politomiler ve farklı yerel çeşitlerin yinelenen eşlemeleri kendi başlarına çelişen soy ilişkisinin kanıtı değildir. Yinelenen veya iç içe uç kimlikleri otomatik çelişki karşılaştırmasının dışında tutulur."
    a_conflicting_summary_topology_does: "Özet topolojinin çelişmesi, hangi bilimsel savın doğru olduğunu belirlemez. Sonsal belirsizlik ve her makaledeki tüm çözümlemeler incelenmemiştir."
    a_script_is_not_a: "Yazı bir dil ailesi değildir. Tarihsel soy, grafik etki ve dillerdeki kullanım farklı şeylerdir; atanın olmaması incelenmediği anlamına gelir, bağımsız icadın kanıtı değildir."
    a_shared_writing_system_or: "Ortak bir yazı sistemi veya parmak alfabesi, dillerin ortak atadan geldiğini kanıtlamaz."
    all_imported_historical_and_influence: "İçe aktarılan tüm tarih ve etki savları birlikte görünür; her bağlantı kendi kaynağını ve belirsizliğini taşır."
    glottolog_classifications_lexical_feature_study: "Glottolog sınıflandırmaları, sözcüksel özelliklere dayalı çalışma ağaçları ve parmak alfabesi grupları aynı kayıtları paylaşır, ancak kanıtlarını ayrı tutar. Gezinme kategorileri evrensel atalar değildir."
    source_specific_sampled_clades_share: "Her kaynağın örneklenmiş kladları aynı dil kayıtlarını paylaşır. İki Avrupa çözümlemesi tek bir çalışmanın tekrarlarıdır."
    historical_descent_graphic_influence_sample: "Tarihsel soy, grafik etki, örnek kimliği ve yazı kullanımı farklı ilişkilerdir. Küresel bir ortak ata ileri sürülmez."
    these_records_remain_searchable_and: "Bu kayıtlar aranabilir ve incelenebilir durumdadır. Bir bağlantının gösterilmemesi bağımsız köken savı değildir."
    standard_chapters_are_sections_of: "Standardın bölümleri tek bir yayının kısımlarıdır, bağımsız çalışmalar değildir. Kaynakça başvuruları içe aktarılan veri kümelerinden ayrılır."
    the_transeurasian_paper_level_debate: "Avrasya ötesi (Transeurasian) hipotezi üzerine makaleler arasındaki tartışma öneri, eleştiri ve yanıtı içerir. Bu, otomatik topoloji karşılaştırmasından ayrıdır."
    these_summary_clades_cannot_both: "Bu özet kladlar ortak örneklenmiş uçlarda aynı anda geçerli olamaz. Bu, hangi çalışmanın doğru olduğunu belirlemez. Aşağıdaki örnekler bu kaydı içeren daha geniş bir grupla ilgili olabilir."
    this_atlas_preserves_every_imported: "Bu atlas içe aktarılan her sınıflandırma savını kaynağıyla birlikte korur. Glottocode’u tam eşleşen kayıtlar tek bir dil kaydını paylaşır. Kaynağa özgü gruplamalar ve eşlenmemiş örnekler ayrı kimliklerini korur. Taslakta yinelenen bir görünüm aynı kayda yapılan bir başvurudur, yeni bir dil değildir."
    this_is_not_every_published: "Bunlar dünyada yayımlanmış tüm ağaçlar değildir. Ethnologue’un tam ve tescilli hiyerarşisi, tüm bölgesel monografiler, tüm tarihsel öneriler, katalog kaynakçaları ve her çelişkinin makale makale tam incelemesi dahil edilmemiştir. Başka bir görüş gösterilmeyen bir düğüm uzlaşı olarak onaylanmış değildir."
    every_assertion_retains_its_source: "Her sav kaynağını korur. Katalog sınıflandırmaları, sözcüksel özelliklere dayalı soy ağaçları, parmak alfabesi grupları, grafik etki ve yazı sistemi kullanımı ayrı tutulur. “Ara aşamalar atlandı”, doğrudan bir üst değil, genel bir tarihsel soy savı anlamına gelir. Çalışma kökleri ve katalog kategorileri gezinme kayıtlarıdır; uydurulmuş tek bir ata değildir."
    glottolog_provides_the_navigation_backbone: "Glottolog gezinmenin iskeletini oluşturur. WALS’taki ve çalışmalardaki diğer dallar mümkün olduğunda ortak atalarının altına yerleştirilir. Bu bağlantı gezinme içindir, yeni bir soy savı değildir. Birden çok aileyi kapsayan veya dış grup ağaçları ayrı bir gezinme bölümünde durur."
    language_details_query_the_public: "Dil ayrıntıları açıldığında herkese açık Hugging Face Hub API’si gerektiğinde sorgulanır. Sonuçlar, model kartındaki dil bilgisinin kaydın kendi ISO koduyla ve belgelenmiş iki harfli karşılığıyla tam eşleşmesini gerektirir. Üst dilin veya makro dilin desteği ağızlara ya da tekil dillere aktarılmaz. Çok dilli modeller görünebilir. Bilgiler yayımcı tarafından sağlanır; kaliteyi, yalnızca o dile desteği veya ağız kapsamını güvence altına almaz. Liste, indirme sayısına göre sıralanmış sınırlı bir örnektir ve Hub’daki tüm sonuçlara bağlantı içerir. Model bilgileri anlık olarak alınır ve sınıflandırmanın XML/OPML dışa aktarımlarına dahil değildir."
    xml_and_json_contain_every: "XML ve JSON her kaydı, savı, notu, kaynağı, kullanım verisini ve girdi sağlama toplamını içerir. OPML, sınıflandırma ve tarih savlarının yinelenen başvurularla oluşturulmuş bir taslağıdır; tüm bilgileri veya CLDR kullanım tablosunu içermez. Her kaynağın hakları geçerliliğini korur: Glottolog CC BY 4.0, SIL CC BY-SA 4.0, Power CLDF GPL-3.0, Unicode verileri Unicode koşullarına tabidir."
    sil_index_rows_exact_iso: "SIL dizininin satırları. ISO kodu tam eşleşenler kayıtları paylaşır; SIL’e özgü tanımlayıcılar ayrı kalır."
    all_glottolog_alias_rows_for: "İşaret dili kategorisi için Glottolog’daki tüm diğer ad satırları, sağlayıcı etiketleriyle korunmuştur. ISO’nun İngilizce ve Fransızca adları ile SIL adları korunur. Dilin kendisinde doğrulanmış adlar, varsa gösterilir. UCD glif örnekleri bir yazının öz adını değil, karakterleri gösterir. Video veya işaret yazımıyla öz adlar uydurulmamıştır."
    all_sources_appear_together_repeated: "Tüm kaynaklar birlikte görünür. Yinelenen dallar paylaşılan kimliklere yapılan başvurulardır. Köken üzerine diğer görüşler kayıt ayrıntılarında bağlantılarla gösterilir; geçici savlar işaretlenmiştir. İki Avrupa uzlaşı ağacı aynı çalışmanın bağımsız çözümlemeleridir, iki ayrı yayın değildir. Tüm işaret dillerini kapsayan bir ağaç içe aktarılmamıştır."
    top_level_entries_of_glottolog: "Glottolog 5.3’ün en üst düzey kayıtları. Her kaydın, sınıflandırmasını izleyen bir URL’de kendi sayfası vardır."
    individual_source_citations_and_licenses: ": her kaynağın alıntıları ve lisansları aşağıdadır. İçe aktarılan özet ağaçlar yazarlarına ve küratörlerine aittir. Kod karşılıkları:"
    consult_each_original_source_before: ". Yeniden dağıtmadan önce her özgün kaynağa başvurun."

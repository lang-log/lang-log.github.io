    this_is_coverage_of_the: "Đây là phạm vi của kho dữ liệu đã nhập, không phải mọi ấn phẩm trên thế giới."
    coverage_is_limited_to_the: "Phạm vi chỉ gồm các nguồn đã nhập. Không hiển thị giả thuyết khác không có nghĩa là có đồng thuận."
    catalog_completeness_is_measured_against: "Mức đầy đủ của danh mục được đo theo các phiên bản đã nhập. Phạm vi nghiên cứu chỉ là một phần, và thiếu nhánh không có nghĩa là đồng ý."
    branches_are_conditional_on_their: "Các nhánh phụ thuộc vào nguồn của chúng. Các vị trí khác nhau được hiển thị cùng nhau; không cần chuyển nguồn."
    independent_families_and_isolates_are: "Các ngữ hệ độc lập và ngôn ngữ biệt lập là những gốc song song. Mở rộng từng nhánh để theo dõi cách phân loại đã ghi nhận."
    click_a_row_to_expand: "Nhấp vào một dòng để mở rộng và xem xét. Chọn một ngôn ngữ để so sánh vị trí theo từng nguồn và các giả thuyết khác có liên kết đến bài báo. Nhánh nghiên cứu cũng mở rộng trong cùng dàn ý."
    expand_a_row_to_follow: "Mở rộng một dòng để theo dõi các nhánh. Chọn “Chi tiết” để xem mọi vị trí và trích dẫn. Tên lặp lại chỉ cùng một bản ghi."
    each_placement_says_according_to: "Mỗi vị trí đều ghi “Theo [nguồn]” và liên kết đến bài báo hoặc danh mục của nó. Phân loại của danh mục không bị ghi nhầm là bài nghiên cứu riêng lẻ."
    different_parent_names_alone_do: "Chỉ riêng việc tên cấp trên khác nhau không chứng minh có mâu thuẫn. Với mỗi cặp cây nghiên cứu, tập bản đồ chỉ so sánh các nhánh giới hạn ở ít nhất ba mã ngôn ngữ mẫu giống nhau. Các nhánh cắt nhau, không lồng nhau được đánh dấu là không tương thích về cấu trúc."
    different_sampling_unresolved_polytomies_and: "Khác biệt trong lấy mẫu, đa phân chưa giải quyết và việc gán lặp lại các biến thể địa phương khác nhau tự chúng không phải là bằng chứng về tổ tiên mâu thuẫn. Các mã đầu mút lặp lại hoặc lồng nhau bị loại khỏi phép so sánh mâu thuẫn tự động."
    a_conflicting_summary_topology_does: "Cấu trúc tóm tắt mâu thuẫn không xác định được khẳng định khoa học nào đúng. Độ bất định hậu nghiệm và mọi phân tích trong từng bài báo chưa được xem xét."
    a_script_is_not_a: "Chữ viết không phải là ngữ hệ. Nguồn gốc lịch sử, ảnh hưởng về tự dạng và việc sử dụng trong ngôn ngữ là khác nhau; thiếu tổ tiên nghĩa là chưa được xem xét, không phải bằng chứng về phát minh độc lập."
    a_shared_writing_system_or: "Dùng chung hệ chữ viết hoặc bảng chữ cái ngón tay không chứng minh các ngôn ngữ có chung tổ tiên."
    all_imported_historical_and_influence: "Mọi khẳng định đã nhập về lịch sử và ảnh hưởng được hiển thị cùng nhau; mỗi đường nối đều kèm nguồn và độ bất định."
    glottolog_classifications_lexical_feature_study: "Phân loại của Glottolog, cây nghiên cứu dựa trên đặc điểm từ vựng và các nhóm bảng chữ cái ngón tay dùng chung bản ghi nhưng giữ bằng chứng riêng. Các nhóm điều hướng không phải là tổ tiên chung."
    source_specific_sampled_clades_share: "Các nhánh mẫu của từng nguồn dùng chung bản ghi ngôn ngữ. Hai lần phân tích châu Âu là các lần lặp của cùng một nghiên cứu."
    historical_descent_graphic_influence_sample: "Nguồn gốc lịch sử, ảnh hưởng về tự dạng, sự đồng nhất của mẫu và việc sử dụng chữ viết là những quan hệ khác nhau. Không khẳng định tổ tiên chung toàn cầu nào."
    these_records_remain_searchable_and: "Các bản ghi này vẫn có thể tìm kiếm và xem xét. Không hiển thị liên kết không phải là khẳng định về nguồn gốc độc lập."
    standard_chapters_are_sections_of: "Các chương của tiêu chuẩn là các phần của một ấn phẩm, không phải nghiên cứu độc lập. Tài liệu tham khảo được phân biệt với các bộ dữ liệu đã nhập."
    the_transeurasian_paper_level_debate: "Cuộc tranh luận giữa các bài báo về giả thuyết Xuyên Á-Âu gồm đề xuất, phê bình và phản hồi. Điều này khác với việc so sánh cấu trúc tự động."
    these_summary_clades_cannot_both: "Các nhánh tóm tắt này không thể cùng đúng trên các đầu mút mẫu chung. Điều này không xác định nghiên cứu nào đúng. Các ví dụ dưới đây có thể liên quan đến một nhóm rộng hơn chứa bản ghi này."
    this_atlas_preserves_every_imported: "Tập bản đồ này lưu giữ mọi khẳng định phân loại đã nhập cùng nguồn của nó. Các mục trùng khớp chính xác Glottocode dùng chung một bản ghi ngôn ngữ. Các nhóm riêng của một nguồn và các mẫu chưa ánh xạ giữ mã riêng. Một mục xuất hiện lặp lại trong dàn ý là tham chiếu đến cùng một bản ghi, không phải ngôn ngữ mới."
    this_is_not_every_published: "Đây không phải là mọi cây đã công bố trên thế giới. Chưa đưa vào hệ thống phân cấp độc quyền đầy đủ của Ethnologue, mọi chuyên khảo khu vực, mọi đề xuất trong lịch sử, thư mục của các danh mục và việc xem xét đầy đủ từng mâu thuẫn theo từng bài báo. Một nút không hiển thị giả thuyết khác chưa được xác nhận là đồng thuận."
    every_assertion_retains_its_source: "Mỗi khẳng định đều giữ nguồn của nó. Phân loại của danh mục, phát sinh chủng loại dựa trên đặc điểm từ vựng, nhóm bảng chữ cái ngón tay, ảnh hưởng về tự dạng và việc sử dụng hệ chữ viết được giữ riêng. “Đã lược các giai đoạn trung gian” nghĩa là một khẳng định khái quát về nguồn gốc lịch sử, không phải cấp trên trực tiếp. Gốc của nghiên cứu và nhóm của danh mục là mục điều hướng, không phải một tổ tiên duy nhất được đặt ra."
    glottolog_provides_the_navigation_backbone: "Glottolog là bộ khung điều hướng. Các nhánh khác của WALS và các nghiên cứu được đặt dưới tổ tiên chung khi có thể. Liên kết này là để điều hướng, không phải khẳng định phả hệ mới. Các cây trải qua nhiều ngữ hệ / nhóm ngoài được để trong một mục điều hướng riêng."
    language_details_query_the_public: "Khi mở chi tiết ngôn ngữ, trang sẽ truy vấn API công khai của Hugging Face Hub theo yêu cầu. Kết quả đòi hỏi siêu dữ liệu ngôn ngữ trong thẻ mô hình khớp chính xác với mã ISO của bản ghi và mã hai chữ cái tương ứng đã được ghi nhận. Không suy ra hỗ trợ của ngôn ngữ cấp trên hoặc ngôn ngữ vĩ mô cho phương ngữ hay ngôn ngữ riêng lẻ. Có thể xuất hiện mô hình đa ngôn ngữ. Siêu dữ liệu do bên công bố cung cấp và không bảo đảm chất lượng, việc chỉ hỗ trợ riêng ngôn ngữ đó hay khả năng bao quát phương ngữ. Danh sách là một mẫu giới hạn sắp theo lượt tải, có liên kết đến toàn bộ kết quả trên Hub. Siêu dữ liệu mô hình được lấy trực tiếp và không có trong các tệp xuất XML/OPML của phân loại."
    xml_and_json_contain_every: "XML và JSON chứa mọi bản ghi, khẳng định, ghi chú, nguồn, dữ liệu sử dụng và tổng kiểm tra đầu vào. OPML là dàn ý các khẳng định về phân loại và lịch sử với tham chiếu lặp lại; không chứa toàn bộ siêu dữ liệu hay bảng sử dụng CLDR. Quyền của từng nguồn vẫn áp dụng: Glottolog CC BY 4.0, SIL CC BY-SA 4.0, Power CLDF GPL-3.0, dữ liệu Unicode theo điều khoản của Unicode."
    sil_index_rows_exact_iso: "Các dòng trong chỉ mục SIL. Các mục khớp chính xác mã ISO dùng chung bản ghi; mã định danh riêng của SIL được giữ riêng."
    all_glottolog_alias_rows_for: "Mọi dòng tên khác của Glottolog thuộc nhóm ngôn ngữ ký hiệu đều được giữ cùng thẻ của bên cung cấp. Tên tiếng Anh, tiếng Pháp của ISO và tên của SIL được giữ lại. Tên đã xác minh trong chính ngôn ngữ đó được hiển thị khi có. Mẫu tự dạng của UCD cho thấy ký tự, không phải tự danh của chữ viết. Không đặt ra tự danh dưới dạng video hay ký pháp ký hiệu."
    all_sources_appear_together_repeated: "Mọi nguồn được hiển thị cùng nhau. Các nhánh lặp lại là tham chiếu đến mã dùng chung. Các giả thuyết khác về nguồn gốc được nêu trong chi tiết bản ghi kèm liên kết; các khẳng định tạm thời được đánh dấu. Hai cây đồng thuận châu Âu là hai phân tích độc lập của cùng một nghiên cứu, không phải hai ấn phẩm. Không nhập cây nào bao gồm mọi ngôn ngữ ký hiệu."
    top_level_entries_of_glottolog: "Các mục cấp cao nhất của Glottolog 5.3. Mỗi bản ghi có trang riêng tại URL theo cách phân loại của nó."
    individual_source_citations_and_licenses: ": trích dẫn và giấy phép của từng nguồn ở bên dưới. Các cây tóm tắt đã nhập thuộc về tác giả và người quản lý của chúng. Tương ứng mã:"
    consult_each_original_source_before: ". Hãy tham khảo từng nguồn gốc trước khi phân phối lại."
    classification: "Phân loại ·"
    name_search_is_exploratory_results: "Tìm theo tên chỉ mang tính khám phá; kết quả không phải là tương ứng đã xác minh."
    selected_historical_relationships_reviewed_chapter: "Đã xem xét một số quan hệ lịch sử được chọn; các mục của chương không được tính là nghiên cứu độc lập."
    all_language_sample_rows_and: "Mọi dòng ngôn ngữ / mẫu và siêu dữ liệu nhóm con đã công bố; không phải bản tái dựng mạng lưới đan xen của bài báo."
    all_explicit_script_entries_under: "Mọi mục chữ viết được nêu rõ trong languageData. Giữ nguyên phân biệt chính / phụ. Không phải danh sách đầy đủ các chính tả trên thế giới; không suy ra phả hệ ngôn ngữ."
    complete_imports_of_the_identified: "Nhập đầy đủ các phiên bản danh mục đã xác định, không phải danh sách đầy đủ mọi ngôn ngữ hay chữ viết trên thế giới."

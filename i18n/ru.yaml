    catalog_completeness_is_measured_against: "Полнота каталогов измеряется относительно импортированных версий. Исследования охвачены частично, и отсутствие ветвей не означает согласия."
    branches_are_conditional_on_their: "Ветви зависят от своего источника. Разные положения показаны вместе; переключать источник не нужно."
    independent_families_and_isolates_are: "Независимые семьи и изоляты — параллельные корни. Раскройте ветвь, чтобы проследить её записанную классификацию."
    click_a_row_to_expand: "Нажмите на строку, чтобы раскрыть и рассмотреть её. Выберите язык, чтобы сравнить его положения по источникам и альтернативы со ссылками на статьи. Ветви исследований раскрываются в той же схеме."
    expand_a_row_to_follow: "Раскройте строку, чтобы проследить её ветви. Все положения и ссылки — в разделе «Подробнее». Повторяющиеся названия относятся к одной и той же записи."
    each_placement_says_according_to: "У каждого положения указано «Согласно [источник]» и есть ссылка на статью или каталог. Классификации каталогов не выдаются за отдельные исследовательские статьи."
    different_parent_names_alone_do: "Различие вышестоящих названий само по себе не доказывает противоречия. Для пар деревьев исследований атлас сравнивает клады, ограниченные как минимум тремя одинаковыми идентификаторами языковых образцов. Пересекающиеся, не вложенные клады отмечаются как топологически несовместимые."
    different_sampling_unresolved_polytomies_and: "Разная выборка, неразрешённые политомии и многократная привязка разных местных вариантов сами по себе не доказывают противоречия в происхождении. Повторяющиеся или вложенные концевые идентификаторы исключаются из автоматического сравнения."
    a_conflicting_summary_topology_does: "Противоречие сводных топологий не определяет, какое научное утверждение верно. Апостериорная неопределённость и все анализы внутри каждой статьи не проверялись."
    a_script_is_not_a: "Письменность — не языковая семья. Историческое происхождение, графическое влияние и употребление в языках — разные вещи; отсутствие предка означает, что это не проверено, а не доказывает независимое изобретение."
    a_shared_writing_system_or: "Общая система письма или общий дактильный алфавит не доказывают общего происхождения языков."
    all_imported_historical_and_influence: "Все импортированные утверждения об истории и влиянии показаны вместе; у каждой связи указаны источник и степень неопределённости."
    glottolog_classifications_lexical_feature_study: "Классификации Glottolog, деревья исследований по лексическим признакам и группы дактильных алфавитов используют общие записи, но хранят свои данные раздельно. Навигационные категории — не всеобщие предки."
    source_specific_sampled_clades_share: "Клады выборок разных источников используют одни и те же записи языков. Два европейских анализа — повторы одного исследования."
    historical_descent_graphic_influence_sample: "Историческое происхождение, графическое влияние, тождество образцов и употребление письменности — разные отношения. Общий для всех предок не утверждается."
    these_records_remain_searchable_and: "Эти записи доступны для поиска и просмотра. Отсутствие показанной связи не означает утверждения о независимом происхождении."
    standard_chapters_are_sections_of: "Главы стандарта — разделы одной публикации, а не независимые исследования. Библиографические ссылки отличаются от импортированных наборов данных."
    the_transeurasian_paper_level_debate: "Дискуссия статей о трансъевразийской гипотезе включает предложение, критику и ответ. Это отдельно от автоматического сравнения топологий."
    these_summary_clades_cannot_both: "Эти сводные клады не могут одновременно выполняться на общих концевых образцах. Это не определяет, какое исследование верно. Примеры ниже могут касаться более широкой группы, включающей эту запись."
    this_atlas_preserves_every_imported: "Атлас сохраняет каждое импортированное утверждение о классификации вместе с источником. Точные совпадения Glottocode объединяются в одну запись языка. Группировки отдельных источников и несопоставленные образцы сохраняют собственные идентификаторы. Повторное появление в схеме — ссылка на ту же запись, а не новый язык."
    this_is_not_every_published: "Здесь собраны не все опубликованные в мире деревья. Не включены полная проприетарная иерархия Ethnologue, все региональные монографии, все исторические гипотезы, библиографии каталогов и полный постатейный разбор каждого противоречия. Узел без показанной альтернативы не удостоверен как консенсусный."
    every_assertion_retains_its_source: "Каждое утверждение сохраняет свой источник. Классификации каталогов, филогении по лексическим признакам, группы дактильных алфавитов, графическое влияние и употребление систем письма остаются раздельными. «Промежуточные этапы опущены» означает общее утверждение об историческом происхождении, а не непосредственного родителя. Корни исследований и категории каталогов — навигационные записи, а не единый выдуманный предок."
    glottolog_provides_the_navigation_backbone: "Glottolog служит навигационным каркасом. Альтернативные ветви WALS и исследований по возможности встроены под их общим предком. Эта привязка служит навигации и не является новым генеалогическим утверждением. Деревья, охватывающие несколько семей или внешние группы, вынесены в отдельный навигационный раздел."
    language_details_query_the_public: "При открытии сведений о языке по запросу опрашивается открытый API Hugging Face Hub. Результаты требуют точного совпадения языковых метаданных в карточке модели с кодом ISO самой записи и его задокументированным двухбуквенным эквивалентом. Поддержка родительского языка или макроязыка не переносится на диалекты и отдельные языки. Могут появляться многоязычные модели. Метаданные предоставлены публикатором и не гарантируют качества, исключительной поддержки языка или охвата диалектов. Список — ограниченная выборка, упорядоченная по числу скачиваний, со ссылками на полные результаты Hub. Метаданные моделей загружаются в реальном времени и не входят в экспорт классификации в XML/OPML."
    xml_and_json_contain_every: "XML и JSON содержат каждую запись, утверждение, заметку, источник, данные об употреблении и контрольную сумму входных данных. OPML — схема утверждений о классификации и истории с повторяющимися ссылками; в неё не входят полные метаданные и таблица употребления CLDR. Права отдельных источников сохраняются: Glottolog CC BY 4.0, SIL CC BY-SA 4.0, Power CLDF GPL-3.0, данные Unicode — на условиях Unicode."
    sil_index_rows_exact_iso: "Строки указателя SIL. Точные совпадения кода ISO используют общую запись; собственные идентификаторы SIL остаются отдельными."
    all_glottolog_alias_rows_for: "Все строки синонимов Glottolog для категории жестовых языков сохранены с тегами поставщика. Сохранены английские и французские названия ISO и названия SIL. Проверенные названия на самом языке показаны, если они есть. Образцы глифов UCD показывают символы, а не самоназвание письменности. Самоназвания в видео или в нотации жестов не придумывались."
    all_sources_appear_together_repeated: "Все источники показаны вместе. Повторяющиеся ветви — ссылки на общие идентификаторы. Альтернативные версии происхождения приведены в сведениях о записи со ссылками; предварительные утверждения помечены. Два европейских консенсусных дерева — независимые анализы одного исследования, а не две публикации. Дерево всех жестовых языков не импортировалось."
    top_level_entries_of_glottolog: "Записи верхнего уровня Glottolog 5.3. У каждой записи есть своя страница с URL, следующим её классификации."
    individual_source_citations_and_licenses: ": ссылки на отдельные источники и лицензии приведены ниже. Импортированные сводные деревья принадлежат их авторам и кураторам. Соответствия кодов:"
    consult_each_original_source_before: ". Перед дальнейшим распространением сверьтесь с каждым исходным источником."
    classification: "Классификация ·"
    name_search_is_exploratory_results: "Поиск по названию носит ориентировочный характер; результаты не являются проверенными соответствиями."
    selected_historical_relationships_reviewed_chapter: "Проверены отдельные исторические связи; разделы глав не считаются независимыми исследованиями."
    all_language_sample_rows_and: "Все строки языков и образцов и опубликованные метаданные подгрупп; это не реконструкция сетевой модели из статьи."
    all_explicit_script_entries_under: "Все явные записи о письменностях в languageData. Различие основной и дополнительной сохранено. Это не полный перечень орфографий мира; генеалогия языков не выводится."
    complete_imports_of_the_identified: "Полный импорт определённых версий каталогов, а не полный перечень всех языков или письменностей мира."

    all_glottolog_name_rows_retain: "Все строки названий Glottolog ({count}) сохраняют поставщика и языковой тег. Названия на самом языке определяются по точному совпадению кода ISO, без догадок; такие названия есть у записей: {count2}. XML экспортирует граф записей и положений по источникам с примерами противоречий и ссылками на статьи. OPML представляет альтернативы вложенными схемами с повторяющимися ссылками на общие записи. SVG экспортирует показанную ветвь."

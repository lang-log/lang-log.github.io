    used_under: ", usados sob a licença"
    this_is_coverage_of_the: "Esta é a cobertura do corpus importado, não de todas as publicações do mundo."
    coverage_is_limited_to_the: "A cobertura limita-se às fontes importadas. A ausência de alternativas exibidas não implica consenso."
    catalog_completeness_is_measured_against: "A completude dos catálogos é medida em relação às versões importadas. A cobertura da pesquisa é parcial, e a ausência de ramos não implica concordância."
    branches_are_conditional_on_their: "Os ramos dependem da sua fonte. Posições diferentes aparecem juntas; não é preciso trocar de fonte."
    independent_families_and_isolates_are: "Famílias independentes e línguas isoladas são raízes paralelas. Expanda cada ramo para acompanhar sua classificação registrada."
    click_a_row_to_expand: "Clique em uma linha para expandi-la e examiná-la. Selecione uma língua para comparar suas posições conforme cada fonte e as alternativas ligadas a artigos. Os ramos de estudos se expandem na mesma estrutura."
    expand_a_row_to_follow: "Expanda uma linha para acompanhar seus ramos. Selecione “Detalhes” para ver todas as posições e citações. Nomes repetidos remetem ao mesmo registro."
    each_placement_says_according_to: "Cada posição indica “Segundo [fonte]” e leva ao seu artigo ou catálogo. Classificações de catálogo não são apresentadas como artigos de pesquisa individuais."
    different_parent_names_alone_do: "Nomes superiores diferentes, por si sós, não provam conflito. Para pares de árvores de estudos, o atlas compara clados restritos a pelo menos três identificadores de língua amostrados idênticos. Clados que se cruzam sem se aninhar são marcados como topologicamente incompatíveis."
    different_sampling_unresolved_polytomies_and: "Amostragens diferentes, politomias não resolvidas e mapeamentos repetidos de variedades locais diferentes não são, por si sós, evidência de ancestralidade conflitante. Identificadores terminais repetidos ou aninhados são excluídos da comparação automática de conflitos."
    a_conflicting_summary_topology_does: "Uma topologia resumida conflitante não determina qual afirmação científica está correta. A incerteza a posteriori e todas as análises de cada artigo não foram revisadas."
    a_script_is_not_a: "Uma escrita não é uma família linguística. Descendência histórica, influência gráfica e uso pelas línguas são coisas distintas; a falta de ancestralidade significa que ela não foi revisada, não que haja prova de invenção independente."
    a_shared_writing_system_or: "Compartilhar um sistema de escrita ou um alfabeto manual não prova ancestralidade linguística comum."
    all_imported_historical_and_influence: "Todas as afirmações importadas sobre história e influência aparecem juntas; cada ligação traz sua fonte e seu grau de incerteza."
    glottolog_classifications_lexical_feature_study: "As classificações do Glottolog, as árvores de estudos por traços lexicais e os grupos de alfabetos manuais compartilham os registros, mas mantêm suas evidências separadas. Categorias de navegação não são ancestrais universais."
    source_specific_sampled_clades_share: "Os clados amostrados de cada fonte compartilham os mesmos registros de língua. As duas análises europeias são repetições de um mesmo estudo."
    historical_descent_graphic_influence_sample: "Descendência histórica, influência gráfica, identidade das amostras e uso da escrita são relações distintas. Nenhum ancestral comum global é afirmado."
    these_records_remain_searchable_and: "Estes registros continuam pesquisáveis e consultáveis. A ausência de ligação exibida não é uma afirmação de origem independente."
    standard_chapters_are_sections_of: "Os capítulos da norma são seções de uma única publicação, não estudos independentes. Referências bibliográficas são distinguidas dos conjuntos de dados importados."
    the_transeurasian_paper_level_debate: "O debate entre artigos sobre a hipótese transeurasiática inclui proposta, crítica e resposta. Isso é distinto da comparação automática de topologias."
    these_summary_clades_cannot_both: "Estes clados resumidos não podem valer ao mesmo tempo nos terminais amostrados comuns. Isso não determina qual estudo está correto. Os exemplos abaixo podem envolver um grupo mais amplo que contém este registro."
    this_atlas_preserves_every_imported: "Este atlas preserva cada afirmação de classificação importada com sua fonte. Correspondências exatas de Glottocode compartilham um único registro de língua. Agrupamentos próprios de uma fonte e amostras sem correspondência mantêm identificadores separados. Uma ocorrência repetida na estrutura é uma referência ao mesmo registro, não uma nova língua."
    this_is_not_every_published: "Estas não são todas as árvores publicadas no mundo. Não foram incorporados a hierarquia proprietária completa do Ethnologue, todas as monografias regionais, todas as propostas históricas, as bibliografias dos catálogos nem uma revisão completa, artigo por artigo, de cada conflito. Um nó sem alternativa exibida não foi certificado como consenso."
    every_assertion_retains_its_source: "Cada afirmação mantém sua fonte. Classificações de catálogo, filogenias por traços lexicais, grupos de alfabetos manuais, influência gráfica e uso de sistemas de escrita permanecem distintos. “Etapas intermediárias omitidas” indica uma afirmação geral de descendência histórica, não um ascendente imediato. Raízes de estudos e categorias de catálogo são entradas de navegação, não um único ancestral inventado."
    glottolog_provides_the_navigation_backbone: "O Glottolog fornece a espinha dorsal da navegação. Ramos alternativos do WALS e de estudos são inseridos sob seu ancestral comum sempre que possível. Essa ligação serve à navegação e não é uma nova afirmação genealógica. Árvores que abrangem várias famílias ou grupos externos ficam em uma seção de navegação separada."
    language_details_query_the_public: "Os detalhes de uma língua consultam sob demanda a API pública do Hugging Face Hub. Os resultados exigem correspondência exata nos metadados de língua do cartão do modelo com o código ISO do próprio registro e seu equivalente documentado de duas letras. O suporte da língua superior ou da macrolíngua não é inferido para dialetos ou línguas individuais. Podem aparecer modelos multilíngues. Os metadados são fornecidos por quem publica e não garantem qualidade, suporte exclusivo à língua nem cobertura de dialetos. A lista é uma amostra limitada ordenada por downloads, com links para todos os resultados do Hub. Os metadados dos modelos são obtidos em tempo real e não estão incluídos nas exportações XML/OPML da classificação."
    xml_and_json_contain_every: "XML e JSON contêm cada registro, afirmação, nota, fonte, dado de uso e soma de verificação de entrada. O OPML é uma estrutura de referências repetidas com as afirmações de classificação e história; não inclui todos os metadados nem a tabela de uso do CLDR. Os direitos de cada fonte continuam válidos: Glottolog CC BY 4.0, SIL CC BY-SA 4.0, Power CLDF GPL-3.0, dados Unicode sob os termos do Unicode."
    sil_index_rows_exact_iso: "Linhas do índice do SIL. Correspondências exatas de código ISO compartilham registros; identificadores próprios do SIL permanecem separados."
    all_glottolog_alias_rows_for: "Todas as linhas de nomes alternativos do Glottolog da categoria de línguas de sinais são preservadas com as etiquetas do seu fornecedor. As denominações ISO em inglês e francês e os nomes do SIL são mantidos. Nomes verificados na própria língua aparecem quando existem. As amostras de glifos do UCD mostram caracteres, não o nome próprio de uma escrita. Não foram inventadas autodenominações em vídeo ou em notação de sinais."
    all_sources_appear_together_repeated: "Todas as fontes aparecem juntas. Ramos repetidos são referências a identificadores compartilhados. Propostas alternativas sobre a origem aparecem nos detalhes do registro com links; afirmações provisórias estão assinaladas. As duas árvores de consenso europeias são análises independentes do mesmo estudo, não duas publicações. Nenhuma árvore de todas as línguas de sinais foi importada."
    top_level_entries_of_glottolog: "Entradas de nível superior do Glottolog 5.3. Cada registro tem sua própria página, em uma URL que segue sua classificação."
    individual_source_citations_and_licenses: ": citações e licenças de cada fonte abaixo. As árvores resumidas importadas são atribuídas a seus autores e curadores. Equivalências de códigos:"
    consult_each_original_source_before: ". Consulte cada fonte original antes de redistribuir."

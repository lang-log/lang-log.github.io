    coverage_is_limited_to_the: "پوشش به منابع واردشده محدود است. نمایش‌ندادن دیدگاه دیگر به معنای اجماع نیست."
    catalog_completeness_is_measured_against: "کامل‌بودن فهرست‌ها نسبت به نسخه‌های واردشده سنجیده می‌شود. پوشش پژوهش‌ها ناقص است و نبودِ شاخه‌ها به معنای توافق نیست."
    branches_are_conditional_on_their: "شاخه‌ها به منبع خود وابسته‌اند. جایگاه‌های گوناگون کنار هم نمایش داده می‌شوند؛ نیازی به تغییر منبع نیست."
    independent_families_and_isolates_are: "خانواده‌های مستقل و زبان‌های منفرد ریشه‌های موازی‌اند. هر شاخه را باز کنید تا رده‌بندی ثبت‌شدهٔ آن را دنبال کنید."
    click_a_row_to_expand: "روی یک ردیف کلیک کنید تا باز شود و آن را بررسی کنید. یک زبان را انتخاب کنید تا جایگاه‌های آن را بر پایهٔ هر منبع و دیدگاه‌های دیگرِ پیوندخورده به مقاله‌ها مقایسه کنید. شاخه‌های پژوهشی نیز در همین طرح باز می‌شوند."
    expand_a_row_to_follow: "یک ردیف را باز کنید تا شاخه‌هایش را دنبال کنید. برای همهٔ جایگاه‌ها و ارجاع‌ها «جزئیات» را انتخاب کنید. نام‌های تکراری به یک رکورد اشاره دارند."
    each_placement_says_according_to: "هر جایگاه «به گفتهٔ [منبع]» را ذکر می‌کند و به مقاله یا فهرست آن پیوند دارد. رده‌بندی‌های فهرست به‌عنوان مقالهٔ پژوهشی جداگانه معرفی نمی‌شوند."
    different_parent_names_alone_do: "تفاوت نام‌های بالادستی به‌تنهایی ناسازگاری را ثابت نمی‌کند. اطلس برای هر جفت درخت پژوهشی، شاخه‌هایی را مقایسه می‌کند که به دست‌کم سه شناسهٔ زبانی یکسان در نمونه‌ها محدود باشند. شاخه‌هایی که یکدیگر را قطع می‌کنند و تودرتو نیستند، از نظر توپولوژیک ناسازگار علامت می‌خورند."
    different_sampling_unresolved_polytomies_and: "تفاوت در نمونه‌گیری، چندشاخگی‌های حل‌نشده و نگاشت تکراری گونه‌های محلی متفاوت به‌خودیِ‌خود شاهدی بر تبار ناسازگار نیستند. شناسه‌های پایانیِ تکراری یا تودرتو از مقایسهٔ خودکار کنار گذاشته می‌شوند."
    a_conflicting_summary_topology_does: "ناسازگاری توپولوژی خلاصه تعیین نمی‌کند کدام ادعای علمی درست است. عدم‌قطعیت پسین و همهٔ تحلیل‌های درون هر مقاله بررسی نشده‌اند."
    a_script_is_not_a: "خط، خانوادهٔ زبانی نیست. تبار تاریخی، تأثیر شکلی و کاربرد در زبان‌ها با هم فرق دارند؛ نبودِ نیا یعنی بررسی نشده است، نه گواهی بر اختراع مستقل."
    a_shared_writing_system_or: "داشتن نظام نوشتاری یا الفبای انگشتی مشترک گواهی بر نیای مشترک زبان‌ها نیست."
    all_imported_historical_and_influence: "همهٔ ادعاهای واردشده دربارهٔ تاریخ و تأثیر کنار هم نمایش داده می‌شوند؛ هر پیوند منبع و میزان عدم‌قطعیت خود را دارد."
    glottolog_classifications_lexical_feature_study: "رده‌بندی‌های Glottolog، درخت‌های پژوهشی مبتنی بر ویژگی‌های واژگانی و گروه‌های الفبای انگشتی رکوردهای یکسانی دارند، اما شواهدشان را جدا نگه می‌دارند. رده‌های پیمایش نیاکان همگانی نیستند."
    source_specific_sampled_clades_share: "شاخه‌های نمونه‌گیری‌شدهٔ هر منبع رکوردهای زبانی یکسانی دارند. دو تحلیل اروپایی تکرارهای یک پژوهش‌اند."
    historical_descent_graphic_influence_sample: "تبار تاریخی، تأثیر شکلی، این‌همانی نمونه‌ها و کاربرد خط روابطی جداگانه‌اند. هیچ نیای مشترک جهانی ادعا نمی‌شود."
    these_records_remain_searchable_and: "این رکوردها همچنان قابل جست‌وجو و بررسی‌اند. نمایش‌ندادن پیوند، ادعای منشأ مستقل نیست."
    standard_chapters_are_sections_of: "فصل‌های استاندارد بخش‌هایی از یک نوشته‌اند، نه پژوهش‌های مستقل. ارجاع‌های کتاب‌شناختی از مجموعه‌داده‌های واردشده جدا شده‌اند."
    the_transeurasian_paper_level_debate: "بحث میان مقاله‌ها دربارهٔ فرضیهٔ فرااوراسیایی شامل پیشنهاد، نقد و پاسخ است. این جدا از مقایسهٔ خودکار توپولوژی‌هاست."
    these_summary_clades_cannot_both: "این شاخه‌های خلاصه نمی‌توانند هم‌زمان بر پایانه‌های مشترک نمونه‌ها درست باشند. این تعیین نمی‌کند کدام پژوهش درست است. نمونه‌های زیر ممکن است به گروهی گسترده‌تر که این رکورد را در بر دارد مربوط باشند."
    this_atlas_preserves_every_imported: "این اطلس هر ادعای رده‌بندیِ واردشده را همراه با منبعش نگه می‌دارد. مدخل‌هایی که Glottocode آن‌ها دقیقاً یکسان است، یک رکورد زبانی مشترک دارند. گروه‌بندی‌های ویژهٔ یک منبع و نمونه‌های نگاشت‌نشده شناسه‌های جداگانه دارند. تکرار در طرح، ارجاع به همان رکورد است، نه زبانی تازه."
    this_is_not_every_published: "این‌ها همهٔ درخت‌های منتشرشده در جهان نیستند. سلسله‌مراتب کامل و انحصاری Ethnologue، همهٔ تک‌نگاری‌های منطقه‌ای، همهٔ پیشنهادهای تاریخی، کتاب‌شناسی‌های فهرست‌ها و بررسی کامل مقاله‌به‌مقالهٔ هر ناسازگاری گنجانده نشده‌اند. گره‌ای که دیدگاه دیگری برایش نمایش داده نمی‌شود، به‌عنوان اجماع تأیید نشده است."
    every_assertion_retains_its_source: "هر ادعا منبع خود را نگه می‌دارد. رده‌بندی‌های فهرست، تبارزایی‌های مبتنی بر ویژگی‌های واژگانی، گروه‌های الفبای انگشتی، تأثیر شکلی و کاربرد نظام‌های نوشتاری جدا می‌مانند. «مرحله‌های میانی حذف شده» یعنی ادعایی کلی دربارهٔ تبار تاریخی، نه والدی مستقیم. ریشه‌های پژوهش‌ها و رده‌های فهرست‌ها مدخل‌های پیمایش‌اند، نه نیایی ساختگی و یگانه."
    glottolog_provides_the_navigation_backbone: "Glottolog اسکلت پیمایش را فراهم می‌کند. شاخه‌های دیگرِ WALS و پژوهش‌ها در صورت امکان زیر نیای مشترکشان قرار می‌گیرند. این پیوند برای پیمایش است، نه ادعای تبارشناختی تازه. درخت‌های فراخانواده‌ای یا برون‌گروهی در بخش پیمایش جداگانه‌ای می‌مانند."
    language_details_query_the_public: "با باز کردن جزئیات یک زبان، در صورت نیاز از API عمومی Hugging Face Hub پرس‌وجو می‌شود. نتایج نیاز دارند که اطلاعات زبانی کارت مدل دقیقاً با کد ISO خود رکورد و معادل دوحرفیِ مستندش یکی باشد. پشتیبانی زبان بالادستی یا کلان‌زبان برای گویش‌ها یا زبان‌های منفرد استنباط نمی‌شود. ممکن است مدل‌های چندزبانه نیز نمایش داده شوند. اطلاعات را ناشر فراهم کرده و کیفیت، پشتیبانی انحصاری از آن زبان یا پوشش گویش‌ها را تضمین نمی‌کند. فهرست نمونه‌ای محدود و مرتب‌شده بر پایهٔ شمار بارگیری است، با پیوند به همهٔ نتایج Hub. اطلاعات مدل‌ها لحظه‌ای دریافت می‌شود و در خروجی‌های XML/OPML رده‌بندی نیست."
    xml_and_json_contain_every: "XML و JSON همهٔ رکوردها، ادعاها، یادداشت‌ها، منابع، داده‌های کاربرد و سرجمع ورودی را در بر دارند. OPML طرحی از ادعاهای رده‌بندی و تاریخ با ارجاع‌های تکراری است؛ همهٔ اطلاعات یا جدول کاربرد CLDR را ندارد. حقوق هر منبع همچنان برقرار است: Glottolog CC BY 4.0، SIL CC BY-SA 4.0، Power CLDF GPL-3.0، داده‌های Unicode طبق شرایط Unicode."
    sil_index_rows_exact_iso: "ردیف‌های نمایهٔ SIL. مدخل‌هایی که کد ISO آن‌ها دقیقاً یکسان است رکورد مشترک دارند؛ شناسه‌های ویژهٔ SIL جدا می‌مانند."
    all_glottolog_alias_rows_for: "همهٔ ردیف‌های نام دیگرِ Glottolog برای ردهٔ زبان‌های اشاره همراه با برچسب فراهم‌کننده نگه داشته شده‌اند. نام‌های انگلیسی و فرانسوی ISO و نام‌های SIL حفظ شده‌اند. نام‌های تأییدشده به خود زبان، در صورت وجود، نمایش داده می‌شوند. نمونه‌های نویسه‌نگارهٔ UCD نویسه‌ها را نشان می‌دهند، نه خودنام یک خط را. خودنام‌هایی به‌صورت ویدیو یا نشانه‌نویسی اشاره ساخته نشده‌اند."
    all_sources_appear_together_repeated: "همهٔ منابع کنار هم نمایش داده می‌شوند. شاخه‌های تکراری ارجاع به شناسه‌های مشترک‌اند. دیدگاه‌های دیگر دربارهٔ منشأ با پیوند در جزئیات رکورد آمده‌اند؛ ادعاهای موقت علامت خورده‌اند. دو درخت اجماعی اروپایی تحلیل‌های مستقلِ یک پژوهش‌اند، نه دو نوشتهٔ جداگانه. درختی از همهٔ زبان‌های اشاره وارد نشده است."
    top_level_entries_of_glottolog: "مدخل‌های بالاترین سطح Glottolog 5.3. هر رکورد صفحهٔ خود را در نشانی‌ای دارد که از رده‌بندی‌اش پیروی می‌کند."
    individual_source_citations_and_licenses: ": ارجاع‌ها و مجوزهای هر منبع در پایین آمده است. درخت‌های خلاصهٔ واردشده به نویسندگان و نگه‌دارندگانشان منسوب‌اند. هم‌ارزی کدها:"
    consult_each_original_source_before: ". پیش از توزیع دوباره، هر منبع اصلی را بررسی کنید."
    classification: "رده‌بندی ·"
    name_search_is_exploratory_results: "جست‌وجوی نام برای کاوش است؛ نتایج تطابق‌های تأییدشده نیستند."
    selected_historical_relationships_reviewed_chapter: "برخی روابط تاریخیِ برگزیده بررسی شده‌اند؛ بخش‌های فصل‌ها پژوهش مستقل به شمار نمی‌آیند."
    all_language_sample_rows_and: "همهٔ ردیف‌های زبان و نمونه و اطلاعات منتشرشدهٔ زیرگروه‌ها؛ بازسازی شبکهٔ درهم‌تنیدهٔ مقاله نیست."
    all_explicit_script_entries_under: "همهٔ مدخل‌های صریح خط در languageData. تمایز اصلی / فرعی حفظ شده است. فهرست کاملی از رسم‌الخط‌های جهان نیست؛ هیچ تبار زبانی استنباط نشده است."
    complete_imports_of_the_identified: "واردکردن کامل نسخه‌های شناسایی‌شدهٔ فهرست‌ها، نه فهرست کاملی از همهٔ زبان‌ها یا خط‌های جهان."

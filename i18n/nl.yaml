    used_under: ", gebruikt onder"
    this_is_coverage_of_the: "Dit is de dekking van het geïmporteerde corpus, niet van alle publicaties ter wereld."
    coverage_is_limited_to_the: "De dekking is beperkt tot de geïmporteerde bronnen. Dat er geen alternatief wordt getoond, betekent geen consensus."
    catalog_completeness_is_measured_against: "De volledigheid van catalogi wordt gemeten aan de geïmporteerde versies. Het onderzoek is maar deels opgenomen, en ontbrekende takken betekenen geen instemming."
    branches_are_conditional_on_their: "Takken hangen af van hun bron. Verschillende indelingen staan naast elkaar; overschakelen tussen bronnen is niet nodig."
    independent_families_and_isolates_are: "Onafhankelijke families en isolaten zijn parallelle wortels. Klap een tak uit om de vastgelegde classificatie te volgen."
    click_a_row_to_expand: "Klik op een rij om die uit te klappen en te bekijken. Kies een taal om de indelingen per bron en de alternatieven met artikelen te vergelijken. Studietakken klappen uit in hetzelfde overzicht."
    expand_a_row_to_follow: "Klap een rij uit om de takken te volgen. Kies ‘Details’ voor alle indelingen en citaten. Herhaalde namen verwijzen naar hetzelfde record."
    each_placement_says_according_to: "Bij elke indeling staat ‘Volgens [bron]’ met een link naar het artikel of de catalogus. Catalogusclassificaties worden niet voorgesteld als afzonderlijke onderzoeksartikelen."
    different_parent_names_alone_do: "Verschillende hogere namen bewijzen op zichzelf geen tegenstrijdigheid. Voor paren studiebomen vergelijkt de atlas clades die beperkt zijn tot ten minste drie identieke taal-ID’s uit de steekproef. Clades die elkaar kruisen zonder genest te zijn, worden als topologisch onverenigbaar gemarkeerd."
    different_sampling_unresolved_polytomies_and: "Andere steekproeven, onopgeloste polytomieën en herhaalde koppelingen van verschillende lokale varianten zijn op zichzelf geen bewijs van tegenstrijdige afstamming. Herhaalde of geneste eind-ID’s worden uitgesloten van de automatische vergelijking."
    a_conflicting_summary_topology_does: "Een tegenstrijdige samenvattende topologie bepaalt niet welke wetenschappelijke bewering juist is. De posterieure onzekerheid en alle analyses binnen elk artikel zijn niet beoordeeld."
    a_script_is_not_a: "Een schrift is geen taalfamilie. Historische afstamming, grafische invloed en gebruik door talen zijn verschillende dingen; een ontbrekende afstamming betekent ‘niet beoordeeld’, geen bewijs van onafhankelijke uitvinding."
    a_shared_writing_system_or: "Een gedeeld schriftsysteem of vingeralfabet bewijst geen gemeenschappelijke afstamming van talen."
    all_imported_historical_and_influence: "Alle geïmporteerde beweringen over geschiedenis en invloed staan samen; elke verbinding vermeldt haar bron en onzekerheid."
    glottolog_classifications_lexical_feature_study: "Glottolog-classificaties, studiebomen op basis van lexicale kenmerken en groepen vingeralfabetten delen de records, maar houden hun bewijs gescheiden. Navigatiecategorieën zijn geen universele voorouders."
    source_specific_sampled_clades_share: "De steekproefclades van elke bron delen dezelfde taalrecords. De twee Europese analyses zijn herhalingen van één studie."
    historical_descent_graphic_influence_sample: "Historische afstamming, grafische invloed, identiteit van voorbeelden en schriftgebruik zijn verschillende relaties. Er wordt geen wereldwijde gemeenschappelijke voorouder beweerd."
    these_records_remain_searchable_and: "Deze records blijven doorzoekbaar en in te zien. Dat er geen verbinding wordt getoond, is geen bewering van onafhankelijke oorsprong."
    standard_chapters_are_sections_of: "De hoofdstukken van de norm zijn delen van één publicatie, geen onafhankelijke studies. Literatuurverwijzingen worden onderscheiden van geïmporteerde datasets."
    the_transeurasian_paper_level_debate: "Het debat tussen artikelen over de Trans-Euraziatische hypothese omvat voorstel, kritiek en antwoord. Dat staat los van de automatische vergelijking van topologieën."
    these_summary_clades_cannot_both: "Deze samenvattende clades kunnen niet tegelijk gelden op de gedeelde eindpunten van de steekproef. Dat bepaalt niet welke studie juist is. De voorbeelden hieronder kunnen een bredere groep betreffen waartoe dit record behoort."
    this_atlas_preserves_every_imported: "Deze atlas bewaart elke geïmporteerde classificatiebewering met haar bron. Exacte Glottocode-overeenkomsten delen één taalrecord. Bronspecifieke groeperingen en niet-gekoppelde voorbeelden houden eigen ID’s. Een herhaald voorkomen in het overzicht verwijst naar hetzelfde record, niet naar een nieuwe taal."
    this_is_not_every_published: "Dit zijn niet alle gepubliceerde bomen ter wereld. Niet opgenomen zijn de volledige gepatenteerde hiërarchie van Ethnologue, alle regionale monografieën, alle historische voorstellen, de bibliografieën van catalogi en een volledige beoordeling van elke tegenstrijdigheid per artikel. Een knoop zonder getoond alternatief is niet als consensus bevestigd."
    every_assertion_retains_its_source: "Elke bewering behoudt haar bron. Catalogusclassificaties, fylogenieën op basis van lexicale kenmerken, groepen vingeralfabetten, grafische invloed en gebruik van schriftsystemen blijven gescheiden. ‘Tussenstadia weggelaten’ betekent een algemene bewering over historische afstamming, geen directe ouder. Wortels van studies en catalogusgroepen zijn navigatie-items, geen verzonnen enkele voorouder."
    glottolog_provides_the_navigation_backbone: "Glottolog vormt het geraamte voor de navigatie. Alternatieve takken uit WALS en studies worden waar mogelijk onder hun gemeenschappelijke voorouder geplaatst. Deze koppeling dient de navigatie en is geen nieuwe genealogische bewering. Bomen over meerdere families of buitengroepen staan in een apart navigatiedeel."
    language_details_query_the_public: "De taaldetails vragen op verzoek de openbare API van de Hugging Face Hub op. Resultaten vereisen een exacte overeenkomst in de taalmetadata van de modelkaart met de eigen ISO-code van het record en het gedocumenteerde tweeletterige equivalent. Ondersteuning van een hogere taal of macrotaal wordt niet afgeleid voor dialecten of afzonderlijke talen. Er kunnen meertalige modellen verschijnen. De metadata komen van de uitgever en garanderen geen kwaliteit, exclusieve taalondersteuning of dekking van dialecten. De lijst is een beperkte steekproef gesorteerd op downloads, met links naar alle resultaten in de Hub. Modelmetadata worden live opgehaald en zitten niet in de XML/OPML-exports van de classificatie."
    xml_and_json_contain_every: "XML en JSON bevatten elk record, elke bewering, notitie, bron, gebruiksgegeven en invoer-checksum. OPML is een overzicht met herhaalde verwijzingen van beweringen over classificatie en geschiedenis; het bevat niet alle metadata of de CLDR-gebruikstabel. De rechten van elke bron blijven gelden: Glottolog CC BY 4.0, SIL CC BY-SA 4.0, Power CLDF GPL-3.0, Unicode-gegevens onder de voorwaarden van Unicode."
    sil_index_rows_exact_iso: "Rijen van de SIL-index. Exacte ISO-code-overeenkomsten delen records; SIL-eigen identificatoren blijven gescheiden."
    all_glottolog_alias_rows_for: "Alle Glottolog-aliasrijen voor de categorie gebarentalen zijn bewaard met de labels van hun leverancier. De Engelse en Franse ISO-benamingen en de SIL-namen blijven behouden. Gecontroleerde namen in de taal zelf verschijnen waar ze bestaan. UCD-glyfvoorbeelden tonen tekens, niet de eigen naam van een schrift. Eigen benamingen in video of gebarennotatie zijn niet verzonnen."
    all_sources_appear_together_repeated: "Alle bronnen staan samen. Herhaalde takken zijn verwijzingen naar gedeelde ID’s. Alternatieve verklaringen over de oorsprong staan met links in de recorddetails; voorlopige beweringen zijn gemarkeerd. De twee Europese consensusbomen zijn onafhankelijke analyses van dezelfde studie, geen twee publicaties. Er is geen boom van alle gebarentalen geïmporteerd."
    top_level_entries_of_glottolog: "Records op het hoogste niveau van Glottolog 5.3. Elk record heeft een eigen pagina op een URL die de classificatie volgt."
    individual_source_citations_and_licenses: ": citaten en licenties per bron hieronder. Geïmporteerde samenvattende bomen worden toegeschreven aan hun auteurs en beheerders. Codeovereenkomsten:"
    consult_each_original_source_before: ". Raadpleeg elke oorspronkelijke bron voordat u verder verspreidt."
    classification: "Classificatie ·"
    name_search_is_exploratory_results: "Zoeken op naam is verkennend; de resultaten zijn geen gecontroleerde overeenkomsten."
    selected_historical_relationships_reviewed_chapter: "Een selectie van historische relaties is beoordeeld; hoofdstukdelen tellen niet als onafhankelijke studies."
    all_language_sample_rows_and: "Alle rijen van talen en voorbeelden en de gepubliceerde subgroepmetadata; geen reconstructie van het netwerk uit het artikel."
    all_explicit_script_entries_under: "Alle expliciete schriftitems onder languageData. Het onderscheid primair/secundair blijft behouden. Geen volledige inventaris van de spellingen ter wereld; er wordt geen taalgenealogie afgeleid."
    complete_imports_of_the_identified: "Volledige imports van de vastgestelde catalogusversies, geen volledige inventaris van alle talen of schriften ter wereld."

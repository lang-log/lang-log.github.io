    each_placement_says_according_to: "Każde umiejscowienie podaje „Według [źródło]” i odsyła do artykułu lub katalogu. Klasyfikacje katalogowe nie są przedstawiane jako osobne artykuły badawcze."
    different_parent_names_alone_do: "Różne nazwy nadrzędne same w sobie nie dowodzą sprzeczności. Dla par drzew z badań atlas porównuje klady ograniczone do co najmniej trzech identycznych identyfikatorów języków z próby. Klady, które się krzyżują i nie są zagnieżdżone, oznacza się jako topologicznie niezgodne."
    different_sampling_unresolved_polytomies_and: "Różny dobór próby, nierozstrzygnięte politomie i wielokrotne przypisania różnych odmian lokalnych same w sobie nie są dowodem sprzecznego pochodzenia. Powtarzające się lub zagnieżdżone identyfikatory końcowe są wyłączone z automatycznego porównania."
    a_conflicting_summary_topology_does: "Sprzeczna topologia podsumowująca nie rozstrzyga, które twierdzenie naukowe jest poprawne. Niepewność a posteriori i wszystkie analizy w poszczególnych artykułach nie zostały przejrzane."
    a_script_is_not_a: "Pismo nie jest rodziną językową. Pochodzenie historyczne, wpływ graficzny i użycie przez języki to różne rzeczy; brak przodka oznacza brak weryfikacji, a nie dowód niezależnego wynalezienia."
    a_shared_writing_system_or: "Wspólny system pisma lub alfabet palcowy nie dowodzi wspólnego pochodzenia języków."
    all_imported_historical_and_influence: "Wszystkie zaimportowane twierdzenia o historii i wpływach są pokazane razem; każde połączenie ma swoje źródło i stopień niepewności."
    glottolog_classifications_lexical_feature_study: "Klasyfikacje Glottologu, drzewa z badań opartych na cechach leksykalnych i grupy alfabetów palcowych dzielą rekordy, ale przechowują dowody osobno. Kategorie nawigacyjne nie są uniwersalnymi przodkami."
    source_specific_sampled_clades_share: "Klady z prób poszczególnych źródeł dzielą te same rekordy języków. Dwie analizy europejskie to powtórzenia jednego badania."
    historical_descent_graphic_influence_sample: "Pochodzenie historyczne, wpływ graficzny, tożsamość próbek i użycie pisma to różne relacje. Nie twierdzi się istnienia globalnego wspólnego przodka."
    these_records_remain_searchable_and: "Te rekordy można nadal wyszukiwać i przeglądać. Brak pokazanego połączenia nie jest twierdzeniem o niezależnym pochodzeniu."
    standard_chapters_are_sections_of: "Rozdziały normy to części jednej publikacji, a nie niezależne badania. Odwołania bibliograficzne są odróżnione od zaimportowanych zbiorów danych."
    the_transeurasian_paper_level_debate: "Debata między artykułami na temat hipotezy transeurazjatyckiej obejmuje propozycję, krytykę i odpowiedź. Jest to coś innego niż automatyczne porównanie topologii."
    these_summary_clades_cannot_both: "Te klady podsumowujące nie mogą jednocześnie zachodzić na wspólnych końcach próby. Nie rozstrzyga to, które badanie jest poprawne. Przykłady poniżej mogą dotyczyć szerszej grupy zawierającej ten rekord."
    this_atlas_preserves_every_imported: "Ten atlas zachowuje każde zaimportowane twierdzenie klasyfikacyjne wraz ze źródłem. Dokładne dopasowania Glottocode dzielą jeden rekord języka. Grupy właściwe danemu źródłu i nieprzypisane próbki zachowują osobne identyfikatory. Powtórne wystąpienie w konspekcie to odwołanie do tego samego rekordu, a nie nowy język."
    this_is_not_every_published: "To nie są wszystkie drzewa opublikowane na świecie. Nie uwzględniono pełnej, zastrzeżonej hierarchii Ethnologue, wszystkich monografii regionalnych, wszystkich propozycji historycznych, bibliografii katalogów ani pełnego przeglądu każdej sprzeczności artykuł po artykule. Węzeł bez pokazanej alternatywy nie został potwierdzony jako konsensus."
    every_assertion_retains_its_source: "Każde twierdzenie zachowuje swoje źródło. Klasyfikacje katalogowe, filogenezy oparte na cechach leksykalnych, grupy alfabetów palcowych, wpływ graficzny i użycie systemów pisma pozostają rozdzielone. „Pominięto etapy pośrednie” oznacza ogólne twierdzenie o pochodzeniu historycznym, a nie bezpośredniego rodzica. Korzenie badań i kategorie katalogów to pozycje nawigacyjne, a nie jeden wymyślony przodek."
    glottolog_provides_the_navigation_backbone: "Glottolog stanowi szkielet nawigacji. Alternatywne gałęzie z WALS i badań są w miarę możliwości umieszczane pod wspólnym przodkiem. To połączenie służy nawigacji i nie jest nowym twierdzeniem genealogicznym. Drzewa obejmujące wiele rodzin lub grupy zewnętrzne pozostają w osobnej sekcji nawigacyjnej."
    language_details_query_the_public: "Szczegóły języka na żądanie odpytują publiczne API Hugging Face Hub. Wyniki wymagają dokładnej zgodności metadanych językowych karty modelu z kodem ISO rekordu i jego udokumentowanym odpowiednikiem dwuliterowym. Obsługa języka nadrzędnego lub makrojęzyka nie jest przenoszona na dialekty ani pojedyncze języki. Mogą pojawić się modele wielojęzyczne. Metadane pochodzą od wydawcy i nie gwarantują jakości, wyłącznej obsługi języka ani pokrycia dialektów. Lista to ograniczona próbka posortowana według liczby pobrań, z linkami do wszystkich wyników w Hub. Metadane modeli są pobierane na bieżąco i nie wchodzą do eksportów XML/OPML klasyfikacji."
    xml_and_json_contain_every: "XML i JSON zawierają każdy rekord, twierdzenie, notatkę, źródło, dane o użyciu i sumę kontrolną danych wejściowych. OPML to konspekt twierdzeń o klasyfikacji i historii z powtarzanymi odwołaniami; nie zawiera wszystkich metadanych ani tabeli użycia CLDR. Prawa poszczególnych źródeł pozostają w mocy: Glottolog CC BY 4.0, SIL CC BY-SA 4.0, Power CLDF GPL-3.0, dane Unicode na warunkach Unicode."
    sil_index_rows_exact_iso: "Wiersze indeksu SIL. Dokładne dopasowania kodu ISO dzielą rekordy; identyfikatory własne SIL pozostają osobne."
    all_glottolog_alias_rows_for: "Wszystkie wiersze aliasów Glottologu dla kategorii języków migowych zachowano wraz ze znacznikami dostawcy. Zachowano angielskie i francuskie nazwy ISO oraz nazwy SIL. Zweryfikowane nazwy w samym języku są pokazywane, jeśli istnieją. Próbki glifów z UCD pokazują znaki, a nie własną nazwę pisma. Nie wymyślano endonimów w formie wideo ani w notacji migowej."
    all_sources_appear_together_repeated: "Wszystkie źródła są pokazane razem. Powtarzające się gałęzie to odwołania do wspólnych identyfikatorów. Alternatywne ujęcia pochodzenia są pokazane w szczegółach rekordu z linkami; twierdzenia wstępne są oznaczone. Dwa europejskie drzewa konsensusu to niezależne analizy tego samego badania, a nie dwie publikacje. Nie zaimportowano drzewa wszystkich języków migowych."
    top_level_entries_of_glottolog: "Pozycje najwyższego poziomu w Glottologu 5.3. Każdy rekord ma własną stronę pod adresem URL odpowiadającym jego klasyfikacji."
    individual_source_citations_and_licenses: ": cytaty i licencje poszczególnych źródeł poniżej. Zaimportowane drzewa podsumowujące przypisuje się ich autorom i kuratorom. Odpowiedniki kodów:"
    consult_each_original_source_before: ". Przed dalszym rozpowszechnianiem sprawdź każde źródło oryginalne."
    classification: "Klasyfikacja ·"
    name_search_is_exploratory_results: "Wyszukiwanie po nazwie ma charakter poglądowy; wyniki nie są zweryfikowanymi dopasowaniami."
    selected_historical_relationships_reviewed_chapter: "Przejrzano wybrane relacje historyczne; części rozdziałów nie są liczone jako niezależne badania."
    all_language_sample_rows_and: "Wszystkie wiersze języków i próbek oraz opublikowane metadane podgrup; nie jest to rekonstrukcja sieci z artykułu."
    all_explicit_script_entries_under: "Wszystkie jawne pozycje pism w languageData. Zachowano rozróżnienie na podstawowe i dodatkowe. Nie jest to pełny spis ortografii świata; nie wywnioskowano genealogii języków."
    complete_imports_of_the_identified: "Pełny import zidentyfikowanych wersji katalogów, a nie pełny spis wszystkich języków lub pism świata."

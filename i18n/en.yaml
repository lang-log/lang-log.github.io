# The interface text of every page and script, in English (.claude/rules/interface-text.md).
# Every other language has a file of the same shape, i18n/<code>.yaml, with the same keys;
# tools/build_i18n.py checks them and writes the dictionaries the pages load (dist/i18n.js
# and dist/i18n/<code>.js, not committed).
# - Text with a placeholder in braces holds a value the page fills in: {count}, {count2} ...
#   are numbers, {date} is a date such as "3 Nov 2026", any other name is any text. A
#   translation may move the placeholders, and {name|tr} translates the value itself.
# - match: the text a placeholder stands for, where it is narrower or wider than the default.

match:
  templates.all_models:
    name: "\\S+"
  templates.kind_and_sources:
    kind: "language|dialect|family|isolate"
    flag: "(?: · ⚑)?"
  templates.kind_and_name:
    kind: "family|language|dialect|isolate|study clade|navigation category"
  templates.medium:
    medium: "spoken|signed|written"
  templates.medium_constructed:
    medium: "spoken|signed|written"

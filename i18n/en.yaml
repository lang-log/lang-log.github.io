    each_placement_says_according_to: "Each placement says “According to [source]” and links to its paper or catalog. Catalog classifications are not mislabeled as individual research papers."
    different_parent_names_alone_do: "Different parent names alone do not prove conflict. For pairs of study trees, the atlas compares clades restricted to at least three identical sampled language IDs. Crossing, non-nested clades are marked as topologically incompatible."
    different_sampling_unresolved_polytomies_and: "Different sampling, unresolved polytomies and repeated mappings of different local varieties are not, by themselves, evidence of conflicting ancestry. Repeated or nested tip IDs are excluded from automatic conflict comparison."
    a_conflicting_summary_topology_does: "A conflicting summary topology does not establish which scientific claim is correct. Posterior uncertainty and all analyses within each paper have not been reviewed."
    a_script_is_not_a: "A script is not a language family. Historical descent, graphic influence and language usage are distinct; missing ancestry is unreviewed, not proof of independent invention."
    a_shared_writing_system_or: "A shared writing system or manual alphabet is not proof of shared language ancestry."
    all_imported_historical_and_influence: "All imported historical and influence assertions appear together; each edge carries its source and uncertainty."
    glottolog_classifications_lexical_feature_study: "Glottolog classifications, lexical-feature study trees and manual-alphabet groups share identities but keep their evidence separate. Navigation categories are not universal ancestors."
    source_specific_sampled_clades_share: "Source-specific sampled clades share the same language identities. Two European runs are replicates of one study."
    historical_descent_graphic_influence_sample: "Historical descent, graphic influence, sample identity and script usage are distinct relations. No global common ancestor is asserted."
    these_records_remain_searchable_and: "These records remain searchable and inspectable. No displayed connection is not a claim of independent origin."
    standard_chapters_are_sections_of: "Standard chapters are sections of one publication, not independent studies. Bibliographic references are distinguished from imported datasets."
    the_transeurasian_paper_level_debate: "The Transeurasian paper-level debate includes proposal, critique and response. This is distinct from automatic topology comparison."
    these_summary_clades_cannot_both: "These summary clades cannot both hold on the shared sampled tips. This does not determine which study is correct. Examples below may involve a wider group containing this record."
    this_atlas_preserves_every_imported: "This atlas preserves every imported classification assertion with its source. Exact Glottocode matches share one canonical language record. Source-specific groupings and unmapped samples retain separate IDs. A repeated appearance in the outline is a reference to the same record, not a new language."
    this_is_not_every_published: "This is not every published tree worldwide. Ethnologue's full proprietary hierarchy, all regional monographs, all historical proposals, catalog bibliographies and a complete paper-by-paper review of every conflict are not incorporated. A node with no displayed alternative has not been certified as consensus."
    every_assertion_retains_its_source: "Every assertion retains its source. Catalog classifications, lexical-feature phylogenies, manual-alphabet groups, graphic influence and writing-system usage remain distinct. “Intermediate stages omitted” means a broad historical descent claim, not an immediate parent. Study roots and catalog categories are navigation entries, not a single invented ancestor."
    glottolog_provides_the_navigation_backbone: "Glottolog provides the navigation backbone. Alternative WALS and study branches are embedded at their shared ancestor where possible. This attachment is for navigation, not a new genealogical claim. Cross-family/outgroup trees remain in a separate navigation section."
    language_details_query_the_public: "Language details query the public Hugging Face Hub API on demand. Results require an exact match in model-card language metadata using the record’s own ISO code and its documented two-letter equivalent. Parent-language and macrolanguage support is not inferred for dialects or individual languages. Multilingual models may appear. Metadata is publisher supplied and does not establish quality, exclusive language support, or dialect coverage. The list is a limited download-sorted sample, with links to the full Hub results. Model metadata is live and is not included in the classification XML/OPML exports."
    xml_and_json_contain_every: "XML and JSON contain every record, assertion, note, source, usage entry and input checksum. OPML is a repeated-reference outline of classification and history assertions; it does not include the full metadata or CLDR usage table. Source-specific rights remain applicable: Glottolog CC BY 4.0, SIL CC BY-SA 4.0, Power CLDF GPL-3.0, Unicode data under Unicode terms."
    sil_index_rows_exact_iso: "SIL index rows. Exact ISO-code matches share records; SIL-local identifiers remain distinct."
    all_glottolog_alias_rows_for: "All Glottolog alias rows for the sign-language category are preserved with their provider tags. ISO English/French labels and SIL names are retained. Verified same-language labels appear where present. UCD glyph samples show characters, not a script’s native name. Video or sign-notation self-names have not been invented."
    all_sources_appear_together_repeated: "All sources appear together. Repeated branches are references to shared IDs. Alternative origin accounts are shown in record details with links; tentative claims are labeled. The two European consensus trees are independent runs of the same study, not two publications. No all-sign-languages tree is imported."

    coverage_still_to_be_completed: "Що ще треба охопити"
    remaining_gaps: "Прогалини, що лишаються"
    integrated_view_all_imported_sources: "Зведений вигляд · усі імпортовані джерела."
    glottolog_sign_category_records: "записи категорії жестових мов Glottolog;"
    downloaded_iso_15924_rows: "завантажені рядки ISO 15924;"
    classification_and_names_from: "Класифікація й назви з"
    used_under: ", за ліцензією"
    this_is_coverage_of_the: "Це охоплення імпортованого корпусу, а не всіх публікацій світу."
    coverage_is_limited_to_the: "Охоплення обмежене імпортованими джерелами. Відсутність показаної альтернативи не означає консенсусу."
    catalog_completeness_is_measured_against: "Повноту каталогів виміряно щодо імпортованих версій. Дослідження охоплено частково, і відсутність гілок не означає згоди."
    branches_are_conditional_on_their: "Гілки залежать від свого джерела. Різні розміщення показано разом; перемикати джерело не потрібно."
    independent_families_and_isolates_are: "Незалежні родини та ізольовані мови — паралельні корені. Розгорніть гілку, щоб простежити її записану класифікацію."
    click_a_row_to_expand: "Натисніть на рядок, щоб розгорнути й розглянути його. Виберіть мову, щоб порівняти її розміщення за джерелами та альтернативи з посиланнями на статті. Гілки досліджень розгортаються в тій самій схемі."
    expand_a_row_to_follow: "Розгорніть рядок, щоб простежити його гілки. Усі розміщення й посилання — у розділі «Подробиці». Повторювані назви стосуються того самого запису."
    each_placement_says_according_to: "Для кожного розміщення зазначено «Згідно з [джерело]» і є посилання на статтю чи каталог. Класифікації каталогів не подано як окремі дослідницькі статті."
    different_parent_names_alone_do: "Сама лише відмінність вищих назв не доводить суперечності. Для пар дерев досліджень атлас порівнює клади, обмежені щонайменше трьома однаковими ідентифікаторами мовних зразків. Клади, що перетинаються, але не вкладені, позначено як топологічно несумісні."
    different_sampling_unresolved_polytomies_and: "Різна вибірка, нерозв’язані політомії та повторне зіставлення різних місцевих варіантів самі по собі не є доказом суперечливого походження. Повторювані або вкладені кінцеві ідентифікатори вилучено з автоматичного порівняння."
    a_conflicting_summary_topology_does: "Суперечність зведених топологій не визначає, яке наукове твердження правильне. Апостеріорну невизначеність і всі аналізи в кожній статті не перевірено."
    a_script_is_not_a: "Писемність — не мовна родина. Історичне походження, графічний вплив і вживання в мовах — різні речі; відсутність предка означає, що це не перевірено, а не доводить незалежного винайдення."
    a_shared_writing_system_or: "Спільна система письма або дактильна абетка не доводить спільного походження мов."
    all_imported_historical_and_influence: "Усі імпортовані твердження про історію та вплив показано разом; кожен зв’язок має своє джерело й ступінь невизначеності."
    glottolog_classifications_lexical_feature_study: "Класифікації Glottolog, дерева досліджень за лексичними ознаками та групи дактильних абеток мають спільні записи, але зберігають свої дані окремо. Навігаційні категорії — не всезагальні предки."
    source_specific_sampled_clades_share: "Клади вибірок окремих джерел мають ті самі записи мов. Два європейські аналізи — повторення одного дослідження."
    historical_descent_graphic_influence_sample: "Історичне походження, графічний вплив, тотожність зразків і вживання писемності — різні відношення. Спільного для всіх предка не стверджується."
    these_records_remain_searchable_and: "Ці записи можна шукати й переглядати. Відсутність показаного зв’язку не є твердженням про незалежне походження."
    standard_chapters_are_sections_of: "Розділи стандарту — частини однієї публікації, а не незалежні дослідження. Бібліографічні посилання відрізнено від імпортованих наборів даних."
    the_transeurasian_paper_level_debate: "Дискусія статей щодо трансєвразійської гіпотези охоплює пропозицію, критику й відповідь. Це окремо від автоматичного порівняння топологій."
    these_summary_clades_cannot_both: "Ці зведені клади не можуть водночас виконуватися на спільних кінцевих зразках. Це не визначає, яке дослідження правильне. Приклади нижче можуть стосуватися ширшої групи, що містить цей запис."
    this_atlas_preserves_every_imported: "Цей атлас зберігає кожне імпортоване твердження про класифікацію разом із джерелом. Точні збіги Glottocode мають один спільний запис мови. Групування окремих джерел і незіставлені зразки зберігають власні ідентифікатори. Повторна поява в схемі — посилання на той самий запис, а не нова мова."
    this_is_not_every_published: "Тут зібрано не всі опубліковані у світі дерева. Не включено повну пропрієтарну ієрархію Ethnologue, усі регіональні монографії, усі історичні гіпотези, бібліографії каталогів і повний постатейний розгляд кожної суперечності. Вузол без показаної альтернативи не засвідчено як консенсусний."
    every_assertion_retains_its_source: "Кожне твердження зберігає своє джерело. Класифікації каталогів, філогенії за лексичними ознаками, групи дактильних абеток, графічний вплив і вживання систем письма лишаються окремими. «Проміжні етапи пропущено» означає загальне твердження про історичне походження, а не безпосереднього батька. Корені досліджень і категорії каталогів — навігаційні записи, а не єдиний вигаданий предок."
    glottolog_provides_the_navigation_backbone: "Glottolog є навігаційним каркасом. Альтернативні гілки WALS і досліджень за можливості вбудовано під їхнім спільним предком. Це приєднання слугує навігації й не є новим генеалогічним твердженням. Дерева, що охоплюють кілька родин або зовнішні групи, винесено в окремий навігаційний розділ."
    language_details_query_the_public: "Під час відкриття подробиць про мову на запит опитується відкритий API Hugging Face Hub. Результати потребують точного збігу мовних метаданих у картці моделі з кодом ISO самого запису та його задокументованим двобуквеним відповідником. Підтримку батьківської мови чи макромови не переносять на діалекти й окремі мови. Можуть з’являтися багатомовні моделі. Метадані надає видавець, і вони не гарантують якості, виключної підтримки мови чи охоплення діалектів. Список — обмежена вибірка, впорядкована за кількістю завантажень, із посиланнями на всі результати Hub. Метадані моделей отримуються в реальному часі й не входять до експорту класифікації в XML/OPML."
    xml_and_json_contain_every: "XML і JSON містять кожен запис, твердження, нотатку, джерело, дані про вживання й контрольну суму вхідних даних. OPML — схема тверджень про класифікацію та історію з повторюваними посиланнями; вона не містить усіх метаданих і таблиці вживання CLDR. Права окремих джерел зберігають чинність: Glottolog CC BY 4.0, SIL CC BY-SA 4.0, Power CLDF GPL-3.0, дані Unicode — на умовах Unicode."
    sil_index_rows_exact_iso: "Рядки покажчика SIL. Точні збіги коду ISO мають спільні записи; власні ідентифікатори SIL лишаються окремими."
    all_glottolog_alias_rows_for: "Усі рядки інших назв Glottolog для категорії жестових мов збережено з тегами постачальника. Збережено англійські й французькі назви ISO та назви SIL. Перевірені назви самою мовою показано, якщо вони є. Зразки гліфів UCD показують символи, а не самоназву писемності. Самоназв у відео чи в жестовій нотації не вигадували."
    all_sources_appear_together_repeated: "Усі джерела показано разом. Повторювані гілки — посилання на спільні ідентифікатори. Альтернативні версії походження наведено в подробицях запису з посиланнями; попередні твердження позначено. Два європейські консенсусні дерева — незалежні аналізи одного дослідження, а не дві публікації. Дерева всіх жестових мов не імпортовано."
    top_level_entries_of_glottolog: "Записи найвищого рівня Glottolog 5.3. Кожен запис має власну сторінку з URL, що відповідає його класифікації."
    individual_source_citations_and_licenses: ": посилання на окремі джерела й ліцензії наведено нижче. Імпортовані зведені дерева належать їхнім авторам і кураторам. Відповідники кодів:"
    consult_each_original_source_before: ". Перш ніж поширювати далі, звірте з кожним першоджерелом."
    classification: "Класифікація ·"
    name_search_is_exploratory_results: "Пошук за назвою має орієнтовний характер; результати не є перевіреними відповідниками."
    selected_historical_relationships_reviewed_chapter: "Перевірено окремі історичні зв’язки; частини розділів не вважаються незалежними дослідженнями."
    all_language_sample_rows_and: "Усі рядки мов і зразків та опубліковані метадані підгруп; це не реконструкція сітчастої мережі зі статті."
    all_explicit_script_entries_under: "Усі явні записи про писемності в languageData. Розрізнення основної та додаткової збережено. Це не повний перелік орфографій світу; генеалогію мов не виводили."

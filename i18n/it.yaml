    used_under: ", usati con licenza"
    this_is_coverage_of_the: "Questa è la copertura del corpus importato, non di tutte le pubblicazioni del mondo."
    coverage_is_limited_to_the: "La copertura è limitata alle fonti importate. L’assenza di alternative mostrate non implica consenso."
    catalog_completeness_is_measured_against: "La completezza dei cataloghi è misurata rispetto alle versioni importate. La copertura della ricerca è parziale e l’assenza di rami non implica accordo."
    branches_are_conditional_on_their: "I rami dipendono dalla loro fonte. Le diverse collocazioni compaiono insieme; non serve cambiare fonte."
    independent_families_and_isolates_are: "Le famiglie indipendenti e le lingue isolate sono radici parallele. Espandi ogni ramo per seguirne la classificazione registrata."
    click_a_row_to_expand: "Fai clic su una riga per espanderla ed esaminarla. Seleziona una lingua per confrontare le sue collocazioni secondo ciascuna fonte e le alternative collegate agli articoli. I rami degli studi si espandono nello stesso schema."
    expand_a_row_to_follow: "Espandi una riga per seguirne i rami. Scegli «Dettagli» per tutte le collocazioni e le citazioni. I nomi ripetuti rimandano alla stessa voce."
    each_placement_says_according_to: "Ogni collocazione indica «Secondo [fonte]» e rimanda al suo articolo o catalogo. Le classificazioni dei cataloghi non sono presentate come singoli articoli di ricerca."
    different_parent_names_alone_do: "Nomi superiori diversi non provano da soli un conflitto. Per le coppie di alberi di studi, l’atlante confronta cladi ristretti ad almeno tre identificatori di lingua campionati identici. I cladi che si incrociano senza essere annidati sono segnalati come topologicamente incompatibili."
    different_sampling_unresolved_polytomies_and: "Campionamenti diversi, politomie non risolte e mappature ripetute di varietà locali diverse non sono, di per sé, prove di una discendenza in conflitto. Gli identificatori terminali ripetuti o annidati sono esclusi dal confronto automatico dei conflitti."
    a_conflicting_summary_topology_does: "Una topologia riassuntiva in conflitto non stabilisce quale affermazione scientifica sia corretta. L’incertezza a posteriori e tutte le analisi interne a ciascun articolo non sono state esaminate."
    a_script_is_not_a: "Una scrittura non è una famiglia linguistica. Discendenza storica, influenza grafica e uso da parte delle lingue sono cose distinte; un’ascendenza mancante significa che non è stata esaminata, non che provi un’invenzione indipendente."
    a_shared_writing_system_or: "Condividere un sistema di scrittura o un alfabeto manuale non prova un’ascendenza linguistica comune."
    all_imported_historical_and_influence: "Tutte le asserzioni importate su storia e influenza compaiono insieme; ogni collegamento riporta la sua fonte e il suo grado di incertezza."
    glottolog_classifications_lexical_feature_study: "Le classificazioni di Glottolog, gli alberi di studi basati su tratti lessicali e i gruppi di alfabeti manuali condividono le voci ma tengono separate le loro evidenze. Le categorie di navigazione non sono antenati universali."
    source_specific_sampled_clades_share: "I cladi campionati di ciascuna fonte condividono le stesse voci di lingua. Le due analisi europee sono repliche di uno stesso studio."
    historical_descent_graphic_influence_sample: "Discendenza storica, influenza grafica, identità dei campioni e uso della scrittura sono relazioni distinte. Non si afferma alcun antenato comune globale."
    these_records_remain_searchable_and: "Queste voci restano ricercabili e consultabili. L’assenza di un collegamento mostrato non è un’affermazione di origine indipendente."
    standard_chapters_are_sections_of: "I capitoli della norma sono sezioni di un’unica pubblicazione, non studi indipendenti. I riferimenti bibliografici sono distinti dai dataset importati."
    the_transeurasian_paper_level_debate: "Il dibattito tra articoli sull’ipotesi transeurasiatica comprende proposta, critica e risposta. È distinto dal confronto automatico delle topologie."
    these_summary_clades_cannot_both: "Questi cladi riassuntivi non possono valere insieme sui terminali campionati comuni. Questo non stabilisce quale studio sia corretto. Gli esempi qui sotto possono riguardare un gruppo più ampio che contiene questa voce."
    this_atlas_preserves_every_imported: "Questo atlante conserva ogni asserzione di classificazione importata con la sua fonte. Le corrispondenze esatte di Glottocode condividono un’unica voce di lingua. I raggruppamenti propri di una fonte e i campioni senza corrispondenza mantengono identificatori separati. Una comparsa ripetuta nello schema è un rimando alla stessa voce, non una nuova lingua."
    this_is_not_every_published: "Questi non sono tutti gli alberi pubblicati al mondo. Non sono inclusi la gerarchia proprietaria completa di Ethnologue, tutte le monografie regionali, tutte le proposte storiche, le bibliografie dei cataloghi né un esame completo, articolo per articolo, di ogni conflitto. Un nodo senza alternative mostrate non è stato certificato come consensuale."
    every_assertion_retains_its_source: "Ogni asserzione conserva la sua fonte. Classificazioni dei cataloghi, filogenesi basate su tratti lessicali, gruppi di alfabeti manuali, influenza grafica e uso dei sistemi di scrittura restano distinti. «Fasi intermedie omesse» indica un’affermazione generale di discendenza storica, non un genitore immediato. Le radici degli studi e le categorie dei cataloghi sono voci di navigazione, non un unico antenato inventato."
    glottolog_provides_the_navigation_backbone: "Glottolog fornisce l’ossatura della navigazione. I rami alternativi di WALS e degli studi sono inseriti, quando possibile, sotto il loro antenato comune. Questo collegamento serve alla navigazione e non è una nuova affermazione genealogica. Gli alberi che coprono più famiglie o gruppi esterni restano in una sezione di navigazione separata."
    language_details_query_the_public: "I dettagli di una lingua interrogano su richiesta l’API pubblica di Hugging Face Hub. I risultati richiedono una corrispondenza esatta nei metadati di lingua della scheda del modello con il codice ISO della voce e il suo equivalente documentato a due lettere. Il supporto della lingua superiore o della macrolingua non viene esteso a dialetti o lingue singole. Possono comparire modelli multilingui. I metadati sono forniti da chi pubblica e non garantiscono qualità, supporto esclusivo della lingua né copertura dei dialetti. L’elenco è un campione limitato ordinato per download, con link a tutti i risultati dell’Hub. I metadati dei modelli sono ottenuti in tempo reale e non sono inclusi nelle esportazioni XML/OPML della classificazione."
    xml_and_json_contain_every: "XML e JSON contengono ogni voce, asserzione, nota, fonte, dato d’uso e checksum di input. L’OPML è uno schema a rimandi ripetuti delle asserzioni di classificazione e di storia; non include tutti i metadati né la tabella d’uso del CLDR. Restano validi i diritti delle singole fonti: Glottolog CC BY 4.0, SIL CC BY-SA 4.0, Power CLDF GPL-3.0, dati Unicode secondo i termini di Unicode."
    sil_index_rows_exact_iso: "Righe dell’indice SIL. Le corrispondenze esatte del codice ISO condividono le voci; gli identificatori propri di SIL restano distinti."
    all_glottolog_alias_rows_for: "Tutte le righe di alias di Glottolog per la categoria delle lingue dei segni sono conservate con le etichette del loro fornitore. Sono mantenute le denominazioni ISO in inglese e francese e i nomi SIL. I nomi verificati nella lingua stessa compaiono quando esistono. I campioni di glifi dell’UCD mostrano caratteri, non il nome proprio di una scrittura. Non sono state inventate autodenominazioni in video o in notazione dei segni."
    all_sources_appear_together_repeated: "Tutte le fonti compaiono insieme. I rami ripetuti sono rimandi a identificatori condivisi. Le ipotesi alternative sull’origine sono mostrate nei dettagli della voce con link; le affermazioni provvisorie sono segnalate. I due alberi di consenso europei sono analisi indipendenti dello stesso studio, non due pubblicazioni. Non è stato importato alcun albero di tutte le lingue dei segni."
    top_level_entries_of_glottolog: "Voci di livello superiore di Glottolog 5.3. Ogni voce ha una propria pagina a un URL che segue la sua classificazione."
    individual_source_citations_and_licenses: ": citazioni e licenze delle singole fonti qui sotto. Gli alberi riassuntivi importati sono attribuiti ai loro autori e curatori. Corrispondenze dei codici:"
    consult_each_original_source_before: ". Consulta ciascuna fonte originale prima di ridistribuire."

    the_transeurasian_paper_level_debate: "关于泛欧亚语系的论文争论包括提出、批评和回应。这与拓扑的自动比较不同。"
    these_summary_clades_cannot_both: "这些汇总分支在共同的样本末端上不可能同时成立。这并不能确定哪一项研究正确。下面的例子可能涉及包含此记录的更大分组。"
    this_atlas_preserves_every_imported: "本图谱保存每条导入的分类主张及其来源。Glottocode 完全一致的条目共享同一条语言记录。来源特有的分组和未对应的样本保留各自的 ID。在列表中重复出现的是对同一记录的引用，而不是新的语言。"
    this_is_not_every_published: "这并不是全世界所有已发表的谱系树。未收入 Ethnologue 的完整专有层级、所有地区性专著、所有历史上的提议、目录的文献清单，以及对每一处冲突逐篇论文的完整审查。未显示其他说法的节点并未被认定为共识。"
    every_assertion_retains_its_source: "每条主张都保留其来源。目录分类、基于词汇特征的系统发生、指拼字母分组、字形影响和文字系统的使用彼此区分。“省略中间阶段”表示概括的历史渊源主张，而不是直接的上位。研究的根和目录类别是导航用的条目，而不是虚构的单一祖先。"
    glottolog_provides_the_navigation_backbone: "Glottolog 构成导航的骨架。WALS 和研究中的其他分支尽可能嵌入其共同祖先之下。这种连接仅用于导航，并不是新的谱系主张。跨语系 / 外群的谱系树放在单独的导航栏目中。"
    language_details_query_the_public: "打开语言详情时，会按需查询公开的 Hugging Face Hub API。结果要求模型卡的语言信息与该记录自身的 ISO 代码及其对应的两字母代码完全一致。不会把上位语言或宏语言的支持推及方言或个别语言。可能出现多语言模型。信息由发布者提供，并不保证质量、仅支持该语言或覆盖方言。列表是按下载量排序的有限样本，并附有指向 Hub 全部结果的链接。模型信息为实时获取，不包含在分类的 XML/OPML 导出中。"
    xml_and_json_contain_every: "XML 和 JSON 包含每条记录、主张、注释、来源、使用数据和输入校验和。OPML 是分类和历史主张的大纲（同一记录以引用形式重复出现），不包含全部信息和 CLDR 使用表。各来源的权利仍然适用：Glottolog CC BY 4.0、SIL CC BY-SA 4.0、Power CLDF GPL-3.0、Unicode 数据适用 Unicode 条款。"
    sil_index_rows_exact_iso: "SIL 索引条目。ISO 代码完全一致的条目共享记录；SIL 自有的标识符保持独立。"
    all_glottolog_alias_rows_for: "手语类别中 Glottolog 的所有别名条目均连同提供者标签一并保存。保留 ISO 的英语和法语名称以及 SIL 名称。经核实的本语言名称在有时显示。UCD 字形样本显示的是字符，而不是文字的自称。没有虚构视频或手语记号形式的自称。"
    all_sources_appear_together_repeated: "所有来源并列显示。重复的分支是对共享 ID 的引用。关于起源的其他说法附链接显示在记录详情中；暂定的主张已加标注。两棵欧洲共识谱系树是同一研究的独立分析，而不是两篇出版物。未导入涵盖所有手语的谱系树。"
    top_level_entries_of_glottolog: "Glottolog 5.3 的最高层级条目。每条记录都有自己的页面，其 URL 与分类对应。"
    individual_source_citations_and_licenses: "：各来源的引文和许可协议见下文。导入的汇总谱系树归其作者和维护者所有。代码对应："

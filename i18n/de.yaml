    used_under: ", verwendet unter"
    this_is_coverage_of_the: "Dies ist der Umfang des importierten Korpus, nicht aller Veröffentlichungen weltweit."
    coverage_is_limited_to_the: "Der Umfang beschränkt sich auf die importierten Quellen. Dass keine Alternative angezeigt wird, bedeutet keinen Konsens."
    catalog_completeness_is_measured_against: "Die Vollständigkeit der Kataloge wird an den importierten Ständen gemessen. Die Forschung ist nur teilweise erfasst, und fehlende Zweige bedeuten keine Zustimmung."
    branches_are_conditional_on_their: "Zweige hängen von ihrer Quelle ab. Unterschiedliche Einordnungen erscheinen nebeneinander; ein Quellenwechsel ist nicht nötig."
    independent_families_and_isolates_are: "Unabhängige Familien und isolierte Sprachen sind parallele Wurzeln. Klappen Sie einen Zweig auf, um seiner verzeichneten Klassifikation zu folgen."
    click_a_row_to_expand: "Klicken Sie auf eine Zeile, um sie aufzuklappen und zu prüfen. Wählen Sie eine Sprache, um ihre Einordnungen nach Quelle und die mit Artikeln verknüpften Alternativen zu vergleichen. Studienzweige werden in derselben Gliederung aufgeklappt."
    expand_a_row_to_follow: "Klappen Sie eine Zeile auf, um ihren Zweigen zu folgen. Unter „Details“ finden Sie alle Einordnungen und Zitate. Wiederholte Namen verweisen auf denselben Eintrag."
    each_placement_says_according_to: "Jede Einordnung nennt „Laut [Quelle]“ und verlinkt auf den Artikel oder Katalog. Katalogklassifikationen werden nicht als einzelne Forschungsartikel ausgegeben."
    different_parent_names_alone_do: "Unterschiedliche übergeordnete Namen allein beweisen keinen Widerspruch. Für Paare von Studienbäumen vergleicht der Atlas Kladen, die auf mindestens drei identische Sprach-IDs der Stichprobe beschränkt sind. Sich kreuzende, nicht verschachtelte Kladen werden als topologisch unvereinbar markiert."
    different_sampling_unresolved_polytomies_and: "Unterschiedliche Stichproben, ungelöste Polytomien und wiederholte Zuordnungen verschiedener lokaler Varietäten sind für sich kein Beleg widersprüchlicher Abstammung. Wiederholte oder verschachtelte End-IDs werden vom automatischen Vergleich ausgeschlossen."
    a_conflicting_summary_topology_does: "Eine widersprüchliche zusammenfassende Topologie entscheidet nicht, welche wissenschaftliche Aussage richtig ist. Die A-posteriori-Unsicherheit und alle Analysen innerhalb der einzelnen Artikel wurden nicht geprüft."
    a_script_is_not_a: "Eine Schrift ist keine Sprachfamilie. Historische Abstammung, grafischer Einfluss und Verwendung durch Sprachen sind verschieden; eine fehlende Abstammung bedeutet „nicht geprüft“, nicht den Nachweis einer unabhängigen Erfindung."
    a_shared_writing_system_or: "Ein gemeinsames Schriftsystem oder Fingeralphabet beweist keine gemeinsame Abstammung der Sprachen."
    all_imported_historical_and_influence: "Alle importierten Aussagen zu Geschichte und Einfluss erscheinen zusammen; jede Verbindung trägt ihre Quelle und ihre Unsicherheit."
    glottolog_classifications_lexical_feature_study: "Glottolog-Klassifikationen, Studienbäume nach lexikalischen Merkmalen und Fingeralphabet-Gruppen teilen sich die Einträge, halten ihre Belege aber getrennt. Navigationskategorien sind keine universellen Vorfahren."
    source_specific_sampled_clades_share: "Die Stichproben-Kladen der einzelnen Quellen teilen sich dieselben Spracheinträge. Die beiden europäischen Läufe sind Wiederholungen einer Studie."
    historical_descent_graphic_influence_sample: "Historische Abstammung, grafischer Einfluss, Identität der Proben und Schriftverwendung sind verschiedene Beziehungen. Ein globaler gemeinsamer Vorfahr wird nicht behauptet."
    these_records_remain_searchable_and: "Diese Einträge bleiben durchsuchbar und einsehbar. Dass keine Verbindung angezeigt wird, ist keine Behauptung eines unabhängigen Ursprungs."
    standard_chapters_are_sections_of: "Die Kapitel der Norm sind Abschnitte einer Veröffentlichung, keine unabhängigen Studien. Literaturangaben werden von importierten Datensätzen unterschieden."
    the_transeurasian_paper_level_debate: "Die Debatte der Artikel zur transeurasischen Hypothese umfasst Vorschlag, Kritik und Erwiderung. Das ist vom automatischen Topologievergleich getrennt."
    these_summary_clades_cannot_both: "Diese zusammenfassenden Kladen können auf den gemeinsamen Stichprobenenden nicht zugleich gelten. Das entscheidet nicht, welche Studie richtig ist. Die Beispiele unten können eine größere Gruppe betreffen, die diesen Eintrag enthält."
    this_atlas_preserves_every_imported: "Dieser Atlas bewahrt jede importierte Klassifikationsaussage mit ihrer Quelle. Exakte Glottocode-Übereinstimmungen teilen sich einen Spracheintrag. Quellenspezifische Gruppierungen und nicht zugeordnete Proben behalten eigene IDs. Ein wiederholtes Vorkommen in der Gliederung verweist auf denselben Eintrag, nicht auf eine neue Sprache."
    this_is_not_every_published: "Dies sind nicht alle weltweit veröffentlichten Bäume. Nicht aufgenommen sind die vollständige proprietäre Hierarchie von Ethnologue, alle regionalen Monografien, alle historischen Vorschläge, die Bibliografien der Kataloge und eine vollständige Prüfung jedes Widerspruchs Artikel für Artikel. Ein Knoten ohne angezeigte Alternative ist nicht als Konsens bestätigt."
    every_assertion_retains_its_source: "Jede Aussage behält ihre Quelle. Katalogklassifikationen, Phylogenien nach lexikalischen Merkmalen, Fingeralphabet-Gruppen, grafischer Einfluss und Verwendung von Schriftsystemen bleiben getrennt. „Zwischenstufen ausgelassen“ bedeutet eine allgemeine Aussage über historische Abstammung, kein unmittelbares Elternteil. Studienwurzeln und Katalogkategorien sind Navigationseinträge, kein einzelner erfundener Vorfahr."
    glottolog_provides_the_navigation_backbone: "Glottolog bildet das Gerüst der Navigation. Alternative Zweige aus WALS und Studien werden, wo möglich, unter ihrem gemeinsamen Vorfahren eingefügt. Diese Anbindung dient der Navigation und ist keine neue genealogische Aussage. Familienübergreifende Bäume und Außengruppen-Bäume stehen in einem eigenen Navigationsbereich."
    language_details_query_the_public: "Die Sprachdetails fragen bei Bedarf die öffentliche API des Hugging Face Hub ab. Ergebnisse erfordern eine exakte Übereinstimmung der Sprach-Metadaten der Modellkarte mit dem ISO-Code des Eintrags und seiner dokumentierten Zwei-Buchstaben-Entsprechung. Die Unterstützung einer übergeordneten Sprache oder Makrosprache wird nicht auf Dialekte oder Einzelsprachen übertragen. Mehrsprachige Modelle können erscheinen. Die Metadaten stammen vom Herausgeber und garantieren weder Qualität noch ausschließliche Sprachunterstützung noch Dialektabdeckung. Die Liste ist eine begrenzte, nach Downloads sortierte Auswahl mit Links zu allen Ergebnissen im Hub. Modell-Metadaten werden live abgerufen und sind nicht in den XML/OPML-Exporten der Klassifikation enthalten."
    xml_and_json_contain_every: "XML und JSON enthalten jeden Eintrag, jede Aussage, Notiz, Quelle, Nutzungsangabe und Eingabe-Prüfsumme. OPML ist eine Gliederung der Klassifikations- und Geschichtsaussagen mit wiederholten Verweisen; sie enthält weder alle Metadaten noch die CLDR-Nutzungstabelle. Die Rechte der einzelnen Quellen gelten weiter: Glottolog CC BY 4.0, SIL CC BY-SA 4.0, Power CLDF GPL-3.0, Unicode-Daten unter den Unicode-Bedingungen."
    sil_index_rows_exact_iso: "Zeilen des SIL-Index. Exakte ISO-Code-Übereinstimmungen teilen sich Einträge; SIL-eigene Kennungen bleiben getrennt."
    all_glottolog_alias_rows_for: "Alle Glottolog-Aliaszeilen der Kategorie Gebärdensprachen sind mit den Tags ihres Anbieters erhalten. Die englischen und französischen ISO-Bezeichnungen und die SIL-Namen bleiben erhalten. Geprüfte Namen in der Sprache selbst erscheinen, wo vorhanden. UCD-Glyphenproben zeigen Zeichen, nicht die Eigenbezeichnung einer Schrift. Eigenbezeichnungen als Video oder in Gebärdennotation wurden nicht erfunden."
    all_sources_appear_together_repeated: "Alle Quellen erscheinen zusammen. Wiederholte Zweige sind Verweise auf gemeinsame IDs. Alternative Ursprungsdeutungen stehen mit Links in den Eintragsdetails; vorläufige Aussagen sind gekennzeichnet. Die beiden europäischen Konsensbäume sind unabhängige Läufe derselben Studie, nicht zwei Veröffentlichungen. Ein Baum aller Gebärdensprachen ist nicht importiert."
    top_level_entries_of_glottolog: "Einträge der obersten Ebene von Glottolog 5.3. Jeder Eintrag hat eine eigene Seite unter einer URL, die seiner Klassifikation folgt."
    individual_source_citations_and_licenses: ": Zitate und Lizenzen der einzelnen Quellen unten. Importierte zusammenfassende Bäume werden ihren Autorinnen, Autoren und Kuratoren zugeschrieben. Code-Entsprechungen:"
    consult_each_original_source_before: ". Prüfen Sie vor jeder Weitergabe die jeweilige Originalquelle."

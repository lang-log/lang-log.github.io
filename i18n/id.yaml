    used_under: ", digunakan dengan lisensi"
    this_is_coverage_of_the: "Ini adalah cakupan korpus yang diimpor, bukan semua terbitan di dunia."
    coverage_is_limited_to_the: "Cakupan terbatas pada sumber yang diimpor. Tidak ditampilkannya alternatif tidak berarti ada konsensus."
    catalog_completeness_is_measured_against: "Kelengkapan katalog diukur terhadap versi yang diimpor. Cakupan penelitian hanya sebagian, dan cabang yang tidak ada tidak berarti persetujuan."
    branches_are_conditional_on_their: "Cabang bergantung pada sumbernya. Penempatan yang berbeda ditampilkan bersama; tidak perlu berganti sumber."
    independent_families_and_isolates_are: "Rumpun mandiri dan bahasa isolat adalah akar sejajar. Buka setiap cabang untuk menelusuri klasifikasi yang tercatat."
    click_a_row_to_expand: "Klik baris untuk membuka dan memeriksanya. Pilih bahasa untuk membandingkan penempatannya menurut setiap sumber dan alternatif yang tertaut ke makalah. Cabang kajian juga dibuka dalam kerangka yang sama."
    expand_a_row_to_follow: "Buka baris untuk menelusuri cabangnya. Pilih “Rincian” untuk semua penempatan dan kutipan. Nama yang berulang merujuk ke catatan yang sama."
    each_placement_says_according_to: "Setiap penempatan menyebutkan “Menurut [sumber]” dan menaut ke makalah atau katalognya. Klasifikasi katalog tidak disajikan sebagai makalah penelitian tersendiri."
    different_parent_names_alone_do: "Perbedaan nama di tingkat atas saja tidak membuktikan pertentangan. Untuk pasangan pohon kajian, atlas membandingkan klad yang dibatasi pada sedikitnya tiga ID bahasa sampel yang identik. Klad yang bersilangan dan tidak bersarang ditandai tidak sejalan secara topologis."
    different_sampling_unresolved_polytomies_and: "Perbedaan sampel, politomi yang belum terselesaikan, dan pemetaan berulang dari ragam lokal yang berbeda bukanlah, dengan sendirinya, bukti leluhur yang bertentangan. ID ujung yang berulang atau bersarang dikeluarkan dari perbandingan otomatis."
    a_conflicting_summary_topology_does: "Topologi ringkasan yang bertentangan tidak menentukan klaim ilmiah mana yang benar. Ketidakpastian posterior dan semua analisis dalam setiap makalah belum ditinjau."
    a_script_is_not_a: "Aksara bukan rumpun bahasa. Keturunan historis, pengaruh grafis, dan penggunaan oleh bahasa adalah hal yang berbeda; leluhur yang tidak ada berarti belum ditinjau, bukan bukti penemuan mandiri."
    a_shared_writing_system_or: "Berbagi sistem tulisan atau abjad jari bukan bukti bahwa bahasa-bahasa itu berleluhur sama."
    all_imported_historical_and_influence: "Semua pernyataan sejarah dan pengaruh yang diimpor ditampilkan bersama; setiap garis membawa sumber dan tingkat ketidakpastiannya."
    glottolog_classifications_lexical_feature_study: "Klasifikasi Glottolog, pohon kajian berdasarkan ciri leksikal, dan kelompok abjad jari berbagi catatan yang sama, tetapi buktinya tetap terpisah. Kategori navigasi bukan leluhur universal."
    source_specific_sampled_clades_share: "Klad sampel dari setiap sumber berbagi catatan bahasa yang sama. Dua analisis Eropa adalah pengulangan dari satu kajian."
    historical_descent_graphic_influence_sample: "Keturunan historis, pengaruh grafis, identitas sampel, dan penggunaan aksara adalah hubungan yang berbeda. Tidak dinyatakan adanya leluhur bersama secara global."
    these_records_remain_searchable_and: "Catatan ini tetap dapat dicari dan diperiksa. Tidak ditampilkannya hubungan bukan klaim asal-usul yang mandiri."
    standard_chapters_are_sections_of: "Bab-bab standar adalah bagian dari satu terbitan, bukan kajian yang mandiri. Rujukan pustaka dibedakan dari kumpulan data yang diimpor."
    the_transeurasian_paper_level_debate: "Perdebatan antarmakalah tentang hipotesis Trans-Eurasia mencakup usulan, kritik, dan tanggapan. Hal ini terpisah dari perbandingan topologi otomatis."
    these_summary_clades_cannot_both: "Klad ringkasan ini tidak mungkin berlaku bersamaan pada ujung sampel yang sama. Hal ini tidak menentukan kajian mana yang benar. Contoh di bawah mungkin menyangkut kelompok lebih luas yang memuat catatan ini."
    this_atlas_preserves_every_imported: "Atlas ini menyimpan setiap pernyataan klasifikasi yang diimpor beserta sumbernya. Entri dengan Glottocode yang persis sama berbagi satu catatan bahasa. Pengelompokan khas sumber dan sampel yang belum dipetakan mempertahankan ID tersendiri. Kemunculan berulang dalam kerangka adalah rujukan ke catatan yang sama, bukan bahasa baru."
    this_is_not_every_published: "Ini bukan semua pohon yang pernah terbit di dunia. Hierarki lengkap Ethnologue yang bersifat hak milik, semua monografi wilayah, semua usulan historis, bibliografi katalog, dan peninjauan lengkap setiap pertentangan makalah demi makalah tidak dimasukkan. Simpul tanpa alternatif yang ditampilkan belum dinyatakan sebagai konsensus."
    every_assertion_retains_its_source: "Setiap pernyataan menyimpan sumbernya. Klasifikasi katalog, filogeni berdasarkan ciri leksikal, kelompok abjad jari, pengaruh grafis, dan penggunaan sistem tulisan tetap terpisah. “Tahap antara dihilangkan” berarti klaim umum tentang keturunan historis, bukan induk langsung. Akar kajian dan kategori katalog adalah entri navigasi, bukan satu leluhur rekaan."
    glottolog_provides_the_navigation_backbone: "Glottolog menjadi kerangka navigasi. Cabang alternatif dari WALS dan kajian ditempatkan di bawah leluhur bersamanya bila memungkinkan. Sambungan ini untuk navigasi, bukan klaim silsilah baru. Pohon lintas rumpun / kelompok luar tetap berada di bagian navigasi tersendiri."
    language_details_query_the_public: "Rincian bahasa menanyakan API publik Hugging Face Hub sesuai permintaan. Hasilnya mensyaratkan kecocokan persis pada metadata bahasa kartu model dengan kode ISO catatan itu sendiri dan padanan dua hurufnya yang terdokumentasi. Dukungan bahasa induk atau makrobahasa tidak disimpulkan untuk dialek atau bahasa tersendiri. Model multibahasa mungkin muncul. Metadata diberikan oleh penerbit dan tidak menjamin mutu, dukungan khusus bahasa itu, atau cakupan dialek. Daftar ini adalah sampel terbatas yang diurutkan menurut unduhan, dengan tautan ke semua hasil di Hub. Metadata model diambil secara langsung dan tidak termasuk dalam ekspor XML/OPML klasifikasi."
    xml_and_json_contain_every: "XML dan JSON memuat setiap catatan, pernyataan, keterangan, sumber, data penggunaan, dan checksum masukan. OPML adalah kerangka pernyataan klasifikasi dan sejarah dengan rujukan berulang; tidak memuat seluruh metadata atau tabel penggunaan CLDR. Hak setiap sumber tetap berlaku: Glottolog CC BY 4.0, SIL CC BY-SA 4.0, Power CLDF GPL-3.0, data Unicode menurut ketentuan Unicode."
    sil_index_rows_exact_iso: "Baris indeks SIL. Entri dengan kode ISO yang persis sama berbagi catatan; pengenal khas SIL tetap terpisah."
    all_glottolog_alias_rows_for: "Semua baris nama lain Glottolog untuk kategori bahasa isyarat disimpan beserta tanda penyedianya. Nama ISO dalam bahasa Inggris dan Prancis serta nama SIL dipertahankan. Nama terverifikasi dalam bahasa itu sendiri ditampilkan bila ada. Contoh glif UCD menampilkan karakter, bukan nama asli suatu aksara. Sebutan diri dalam bentuk video atau notasi isyarat tidak direka."
    all_sources_appear_together_repeated: "Semua sumber ditampilkan bersama. Cabang berulang adalah rujukan ke ID bersama. Penjelasan alternatif tentang asal-usul ditampilkan dalam rincian catatan dengan tautan; klaim sementara diberi tanda. Dua pohon konsensus Eropa adalah analisis mandiri dari kajian yang sama, bukan dua terbitan. Tidak ada pohon seluruh bahasa isyarat yang diimpor."
    top_level_entries_of_glottolog: "Entri tingkat teratas Glottolog 5.3. Setiap catatan memiliki halaman sendiri pada URL yang mengikuti klasifikasinya."
    individual_source_citations_and_licenses: ": kutipan dan lisensi setiap sumber ada di bawah. Pohon ringkasan yang diimpor diatribusikan kepada penulis dan pengelolanya. Padanan kode:"
    consult_each_original_source_before: ". Periksa setiap sumber asli sebelum mendistribusikan ulang."

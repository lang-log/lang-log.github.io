    coverage_is_limited_to_the: "범위는 가져온 출처로 한정됩니다. 다른 학설이 표시되지 않아도 합의가 있다는 뜻은 아닙니다."
    catalog_completeness_is_measured_against: "목록이 갖추어졌는지는 가져온 판을 기준으로 합니다. 연구는 일부만 포함되어 있으며, 분기가 없다고 해서 동의를 뜻하지는 않습니다."
    branches_are_conditional_on_their: "분기는 출처에 따라 달라집니다. 서로 다른 위치가 함께 표시되므로 출처를 바꿀 필요가 없습니다."
    independent_families_and_isolates_are: "독립된 어족과 고립어는 나란한 뿌리입니다. 각 계통을 펼치면 기록된 분류를 따라갈 수 있습니다."
    click_a_row_to_expand: "행을 누르면 펼쳐서 자세히 볼 수 있습니다. 언어를 고르면 출처별 위치와 논문에 근거한 다른 학설을 비교할 수 있습니다. 연구의 분기도 같은 목록 안에서 펼칠 수 있습니다."
    expand_a_row_to_follow: "행을 펼치면 계통을 따라갈 수 있습니다. 모든 위치와 인용은 ‘상세’에서 볼 수 있습니다. 여러 번 나오는 이름은 같은 기록을 가리킵니다."
    each_placement_says_according_to: "모든 위치에는 ‘출처: [자료명]’이 있고 그 논문이나 목록으로 연결됩니다. 목록의 분류를 개별 연구 논문으로 잘못 표시하지 않습니다."
    different_parent_names_alone_do: "상위 이름이 다르다는 것만으로는 충돌이라고 할 수 없습니다. 연구 계통수끼리는 같은 언어 ID 표본이 3개 이상인 분기로 한정하여 비교합니다. 서로 교차하고 포함 관계가 아닌 분기를 위상적으로 양립하지 않는 것으로 표시합니다."
    different_sampling_unresolved_polytomies_and: "표본의 차이, 해결되지 않은 다분지, 서로 다른 지역 변종의 반복된 대응은 그 자체로 계통 충돌의 증거가 아닙니다. 반복되거나 포함된 말단 ID는 자동 충돌 비교에서 제외합니다."
    a_conflicting_summary_topology_does: "요약 위상이 충돌한다고 해서 어느 과학적 주장이 옳은지 정해지지는 않습니다. 사후 분포의 불확실성과 각 논문 안의 모든 분석은 검토하지 않았습니다."
    a_script_is_not_a: "문자는 어족이 아닙니다. 역사적 계통, 자형의 영향, 언어의 사용은 서로 다릅니다. 조상이 없는 것은 검토되지 않았기 때문이며, 독자적으로 발명되었다는 증거가 아닙니다."
    a_shared_writing_system_or: "같은 문자 체계나 지문자를 쓴다고 해서 언어의 조상이 같다는 증거가 되지는 않습니다."
    all_imported_historical_and_influence: "가져온 역사와 영향의 주장을 모두 함께 보여 줍니다. 각 선에는 출처와 불확실성이 붙어 있습니다."
    glottolog_classifications_lexical_feature_study: "Glottolog의 분류, 어휘 특징에 따른 연구 계통수, 지문자 집단은 같은 기록을 공유하지만 근거는 따로 유지합니다. 탐색용 범주는 공통 조상이 아닙니다."
    source_specific_sampled_clades_share: "출처별 표본 분기는 같은 언어 기록을 공유합니다. 유럽의 두 분석은 한 연구의 반복입니다."
    historical_descent_graphic_influence_sample: "역사적 계통, 자형의 영향, 표본의 동일성, 문자의 사용은 서로 다른 관계입니다. 전체에 공통된 조상은 주장하지 않습니다."
    these_records_remain_searchable_and: "이 기록들도 검색하고 살펴볼 수 있습니다. 연결이 표시되지 않았다고 해서 독립된 기원을 주장하는 것은 아닙니다."
    standard_chapters_are_sections_of: "표준의 각 장은 한 출판물의 절이며 독립된 연구가 아닙니다. 문헌 참조와 가져온 데이터 세트는 구별합니다."
    the_transeurasian_paper_level_debate: "트랜스유라시아 가설에 관한 논문 간 논쟁(제안, 비판, 응답)을 포함합니다. 이는 위상의 자동 비교와는 별개입니다."
    these_summary_clades_cannot_both: "이 요약 분기들은 공통 표본 말단에서 동시에 성립할 수 없습니다. 어느 연구가 옳은지는 정해지지 않습니다. 아래 예는 이 기록을 포함하는 더 넓은 집단에 관한 것일 수 있습니다."
    this_atlas_preserves_every_imported: "이 지도는 가져온 모든 분류 주장을 출처와 함께 보존합니다. Glottocode가 정확히 일치하면 하나의 언어 기록을 공유합니다. 출처 고유의 집단과 대응되지 않은 표본은 별도의 ID를 유지합니다. 목록에 반복해 나오는 것은 같은 기록에 대한 참조이며 새로운 언어가 아닙니다."
    this_is_not_every_published: "전 세계에 발표된 모든 계통수가 있는 것은 아닙니다. Ethnologue의 유료 전체 계층, 모든 지역별 연구서, 역사상의 모든 제안, 목록의 문헌 목록, 모든 충돌에 대한 논문별 전수 검토는 포함하지 않았습니다. 다른 학설이 표시되지 않은 항목도 합의가 확인된 것은 아닙니다."
    every_assertion_retains_its_source: "모든 주장에는 출처가 있습니다. 목록의 분류, 어휘 특징에 따른 계통, 지문자 집단, 자형의 영향, 문자 체계의 사용은 따로 다룹니다. ‘중간 단계 생략’은 대략적인 역사적 계통의 주장이며 직접적인 부모가 아닙니다. 연구의 뿌리와 목록의 범주는 탐색용 항목이며 만들어 낸 하나의 조상이 아닙니다."
    glottolog_provides_the_navigation_backbone: "Glottolog를 탐색의 뼈대로 삼습니다. WALS와 연구의 다른 분기는 가능하면 공통 조상 아래에 넣습니다. 이 연결은 탐색을 위한 것이며 새로운 계통 주장이 아닙니다. 여러 어족에 걸치거나 외군인 계통수는 별도의 탐색 칸에 둡니다."
    language_details_query_the_public: "언어 상세를 열면 공개된 Hugging Face Hub API에 그때그때 조회합니다. 모델 카드의 언어 정보가 그 기록의 ISO 코드나 문서화된 두 글자 코드와 정확히 일치하는 것만 보여 줍니다. 방언이나 개별 언어에 상위 언어나 매크로 언어의 지원을 적용하지 않습니다. 다국어 모델이 나올 수 있습니다. 정보는 게시자가 붙인 것으로 품질, 그 언어만의 지원, 방언 지원을 보장하지 않습니다. 목록은 내려받기 수 순의 일부이며 Hub의 전체 결과로 가는 링크가 있습니다. 모델 정보는 실시간으로 가져오며 분류의 XML/OPML 내보내기에는 포함되지 않습니다."
    xml_and_json_contain_every: "XML과 JSON에는 모든 기록, 주장, 메모, 출처, 사용 데이터, 입력 체크섬이 들어 있습니다. OPML은 분류와 역사 주장의 목록(같은 기록은 참조로 반복됨)이며 전체 정보나 CLDR 사용표는 포함하지 않습니다. 출처별 권리는 그대로 적용됩니다: Glottolog CC BY 4.0, SIL CC BY-SA 4.0, Power CLDF GPL-3.0, Unicode 데이터는 Unicode 이용 조건."
    sil_index_rows_exact_iso: "SIL 색인의 행입니다. ISO 코드가 정확히 일치하면 기록을 공유하고, SIL 고유 식별자는 따로 유지합니다."
    all_glottolog_alias_rows_for: "수어 범주에 대한 Glottolog의 별칭 행은 제공자 태그와 함께 모두 보존합니다. ISO의 영어·프랑스어 이름과 SIL 이름도 남겨 둡니다. 확인된 그 언어 자체의 이름은 있을 때만 표시합니다. UCD 자형 견본은 문자를 보여 줄 뿐 문자 체계의 자칭이 아닙니다. 영상이나 수어 표기로 된 자칭을 만들어 내지 않았습니다."
    all_sources_appear_together_repeated: "모든 출처를 함께 보여 줍니다. 반복되는 계통은 공유 ID에 대한 참조입니다. 기원에 관한 다른 학설은 기록 상세에 링크와 함께 보여 주며, 잠정적 주장에는 표시를 붙였습니다. 유럽의 두 합의 계통수는 같은 연구의 독립된 분석이며 두 편의 출판물이 아닙니다. 모든 수어를 아우르는 계통수는 가져오지 않았습니다."
    top_level_entries_of_glottolog: "Glottolog 5.3의 최상위 항목입니다. 모든 기록에는 분류를 따르는 URL의 전용 페이지가 있습니다."
    individual_source_citations_and_licenses: ": 출처별 인용과 이용 허락은 아래에 있습니다. 가져온 요약 계통수는 그 저자와 관리자에게 귀속됩니다. 코드 대응:"
    consult_each_original_source_before: ". 재배포하기 전에 각 원래 자료를 확인해 주세요."
    classification: "분류 ·"
    name_search_is_exploratory_results: "이름 검색은 탐색용이며, 결과가 확인된 대응은 아닙니다."
    selected_historical_relationships_reviewed_chapter: "선정한 역사적 관계를 검토했습니다. 장과 절은 독립된 연구로 세지 않습니다."
    all_language_sample_rows_and: "모든 언어·표본 행과 발표된 하위 집단 정보입니다. 논문의 그물 모양 네트워크를 재구성한 것이 아닙니다."
    all_explicit_script_entries_under: "languageData에 있는 모든 명시적 문자 항목입니다. 주·부 구분도 유지합니다. 세계 정서법의 완전한 목록이 아니며, 언어 계통도 추정하지 않습니다."
    complete_imports_of_the_identified: "확인한 판의 목록을 통째로 가져온 것으로, 세계 모든 언어나 문자의 완전한 목록이 아닙니다."

    name_search_is_exploratory_results: "La recherche par nom est exploratoire ; les résultats ne sont pas des correspondances vérifiées."
    selected_historical_relationships_reviewed_chapter: "Certaines relations historiques ont été examinées ; les sections de chapitres ne sont pas comptées comme des études indépendantes."
    all_language_sample_rows_and: "Toutes les lignes de langues et d’échantillons et les métadonnées de sous-groupes publiées ; ce n’est pas une reconstruction du réseau réticulé de l’article."
    all_explicit_script_entries_under: "Toutes les entrées d’écriture explicites dans languageData. La distinction entre principale et secondaire est conservée. Ce n’est pas un inventaire complet des orthographes du monde ; aucune généalogie des langues n’est déduite."
    complete_imports_of_the_identified: "Imports complets des versions de catalogue identifiées, et non un inventaire complet de toutes les langues ou écritures du monde."

    used_under: ", utilisés sous licence"
    this_is_coverage_of_the: "Il s’agit de la couverture du corpus importé, et non de toutes les publications du monde."
    coverage_is_limited_to_the: "La couverture se limite aux sources importées. L’absence d’alternative affichée n’implique pas un consensus."
    catalog_completeness_is_measured_against: "L’exhaustivité des catalogues est mesurée par rapport aux versions importées. La couverture de la recherche est partielle, et l’absence de branches n’implique pas un accord."
    branches_are_conditional_on_their: "Les branches dépendent de leur source. Les différents classements apparaissent ensemble ; il n’est pas nécessaire de changer de source."
    independent_families_and_isolates_are: "Les familles indépendantes et les isolats sont des racines parallèles. Dépliez chaque branche pour suivre sa classification enregistrée."
    click_a_row_to_expand: "Cliquez sur une ligne pour la déplier et l’examiner. Sélectionnez une langue pour comparer ses classements selon chaque source et les alternatives liées à des articles. Dépliez une branche d’étude dans le même plan."
    expand_a_row_to_follow: "Dépliez une ligne pour suivre ses branches. Choisissez « Détails » pour voir tous les classements et toutes les citations. Les noms répétés renvoient à la même notice."
    each_placement_says_according_to: "Chaque classement indique « Selon [source] » et renvoie à son article ou à son catalogue. Les classifications de catalogue ne sont pas présentées comme des articles de recherche individuels."
    different_parent_names_alone_do: "Des noms supérieurs différents ne prouvent pas à eux seuls un conflit. Pour chaque paire d’arbres d’études, l’atlas compare des clades restreints à au moins trois identifiants de langue échantillonnés identiques. Les clades qui se croisent sans s’emboîter sont signalés comme topologiquement incompatibles."
    different_sampling_unresolved_polytomies_and: "Un échantillonnage différent, des polytomies non résolues et des rattachements répétés de variétés locales différentes ne prouvent pas, à eux seuls, une ascendance en conflit. Les identifiants terminaux répétés ou emboîtés sont exclus de la comparaison automatique des conflits."
    a_conflicting_summary_topology_does: "Une topologie de synthèse en conflit ne détermine pas quelle affirmation scientifique est correcte. L’incertitude a posteriori et l’ensemble des analyses de chaque article n’ont pas été examinées."
    a_script_is_not_a: "Une écriture n’est pas une famille de langues. La filiation historique, l’influence graphique et l’usage par les langues sont distincts ; une ascendance manquante n’a pas été examinée et ne prouve pas une invention indépendante."
    a_shared_writing_system_or: "Un système d’écriture ou un alphabet manuel commun ne prouve pas une ascendance linguistique commune."
    all_imported_historical_and_influence: "Toutes les assertions importées sur l’histoire et l’influence apparaissent ensemble ; chaque lien porte sa source et son degré d’incertitude."
    glottolog_classifications_lexical_feature_study: "Les classifications de Glottolog, les arbres d’études fondés sur des traits lexicaux et les groupes d’alphabets manuels partagent les identités mais gardent leurs preuves séparées. Les catégories de navigation ne sont pas des ancêtres universels."
    source_specific_sampled_clades_share: "Les clades échantillonnés propres à chaque source partagent les mêmes identités de langue. Les deux analyses européennes sont des réplications d’une même étude."
    historical_descent_graphic_influence_sample: "La filiation historique, l’influence graphique, l’identité des échantillons et l’usage des écritures sont des relations distinctes. Aucun ancêtre commun global n’est affirmé."
    these_records_remain_searchable_and: "Ces notices restent consultables et examinables. L’absence de lien affiché n’est pas une affirmation d’origine indépendante."
    standard_chapters_are_sections_of: "Les chapitres de la norme sont des sections d’une seule publication, et non des études indépendantes. Les références bibliographiques sont distinguées des jeux de données importés."
    the_transeurasian_paper_level_debate: "Le débat transeurasien entre articles comprend proposition, critique et réponse. Cela est distinct de la comparaison automatique des topologies."
    these_summary_clades_cannot_both: "Ces clades de synthèse ne peuvent pas être vrais en même temps sur les terminaux échantillonnés communs. Cela ne détermine pas quelle étude est correcte. Les exemples ci-dessous peuvent concerner un groupe plus large contenant cette notice."
    this_atlas_preserves_every_imported: "Cet atlas conserve chaque assertion de classification importée avec sa source. Les correspondances exactes de Glottocode partagent une seule notice de langue. Les regroupements propres à une source et les échantillons sans correspondance gardent des identifiants distincts. Une apparition répétée dans le plan renvoie à la même notice, et non à une nouvelle langue."
    this_is_not_every_published: "Ceci ne réunit pas tous les arbres publiés dans le monde. La hiérarchie propriétaire complète d’Ethnologue, toutes les monographies régionales, toutes les propositions historiques, les bibliographies des catalogues et un examen complet, article par article, de chaque conflit ne sont pas intégrés. Un nœud sans alternative affichée n’a pas été certifié comme consensuel."
    every_assertion_retains_its_source: "Chaque assertion conserve sa source. Les classifications de catalogue, les phylogénies fondées sur des traits lexicaux, les groupes d’alphabets manuels, l’influence graphique et l’usage des systèmes d’écriture restent distincts. « Étapes intermédiaires omises » désigne une affirmation générale de filiation historique, et non un parent immédiat. Les racines d’études et les catégories de catalogue sont des entrées de navigation, et non un ancêtre unique inventé."
    glottolog_provides_the_navigation_backbone: "Glottolog fournit l’ossature de navigation. Les branches alternatives du WALS et des études sont insérées sous leur ancêtre commun lorsque c’est possible. Ce rattachement sert à la navigation et ne constitue pas une nouvelle affirmation généalogique. Les arbres couvrant plusieurs familles ou des groupes externes restent dans une section de navigation distincte."
    language_details_query_the_public: "Les détails d’une langue interrogent à la demande l’API publique du Hugging Face Hub. Les résultats exigent une correspondance exacte dans les métadonnées de langue de la fiche du modèle, avec le code ISO de la notice et son équivalent documenté à deux lettres. La prise en charge de la langue mère ou de la macrolangue n’est pas déduite pour les dialectes ou les langues individuelles. Des modèles multilingues peuvent apparaître. Les métadonnées sont fournies par l’éditeur et ne garantissent ni la qualité, ni une prise en charge exclusive de la langue, ni la couverture des dialectes. La liste est un échantillon limité trié par téléchargements, avec des liens vers tous les résultats du Hub. Les métadonnées des modèles sont obtenues en direct et ne figurent pas dans les exports XML/OPML de la classification."
    xml_and_json_contain_every: "Les fichiers XML et JSON contiennent chaque notice, assertion, note, source, donnée d’usage et somme de contrôle d’entrée. L’OPML est un plan à références répétées des assertions de classification et d’histoire ; il ne contient ni toutes les métadonnées ni la table d’usage du CLDR. Les droits propres à chaque source restent applicables : Glottolog CC BY 4.0, SIL CC BY-SA 4.0, Power CLDF GPL-3.0, données Unicode selon les conditions d’Unicode."
    sil_index_rows_exact_iso: "Lignes de l’index du SIL. Les correspondances exactes de code ISO partagent une notice ; les identifiants propres au SIL restent distincts."
    all_glottolog_alias_rows_for: "Toutes les lignes d’alias de Glottolog de la catégorie des langues des signes sont conservées avec les étiquettes de leur fournisseur. Les dénominations ISO en anglais et en français et les noms du SIL sont conservés. Les noms vérifiés dans la langue elle-même apparaissent lorsqu’ils existent. Les échantillons de glyphes de l’UCD montrent des caractères, et non le nom autochtone d’une écriture. Aucune autodénomination en vidéo ou en notation des signes n’a été inventée."
    all_sources_appear_together_repeated: "Toutes les sources apparaissent ensemble. Les branches répétées sont des références à des identifiants communs. Les autres hypothèses sur l’origine figurent dans les détails de la notice avec des liens ; les affirmations provisoires sont signalées. Les deux arbres de consensus européens sont des analyses indépendantes de la même étude, et non deux publications. Aucun arbre de toutes les langues des signes n’est importé."
    top_level_entries_of_glottolog: "Entrées de niveau supérieur de Glottolog 5.3. Chaque notice a sa propre page, à une URL qui suit sa classification."
    individual_source_citations_and_licenses: " : citations et licences de chaque source ci-dessous. Les arbres de synthèse importés sont attribués à leurs auteurs et à leurs responsables. Correspondances de codes :"
    consult_each_original_source_before: ". Consultez chaque source d’origine avant toute redistribution."

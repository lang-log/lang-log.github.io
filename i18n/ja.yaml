    different_sampling_unresolved_polytomies_and: "標本の違い、解決していない多分岐、別々の地域変種が同じ言語に何度も対応づけられていることは、それだけでは系統の食い違いの証拠になりません。繰り返し出てくる末端 ID や入れ子の末端 ID は、自動の比較から外しています。"
    a_conflicting_summary_topology_does: "要約の系統樹が食い違っていても、どちらの説が正しいかは決まりません。事後分布の不確かさや、各論文の中のすべての分析までは確認していません。"
    a_script_is_not_a: "文字体系は語族ではありません。歴史的な系統、字形の影響、言語での使用は別のものです。祖先がないのは未確認だからで、独自に発明された証拠ではありません。"
    a_shared_writing_system_or: "同じ文字体系や指文字を使っていても、言語の祖先が同じ証拠にはなりません。"
    all_imported_historical_and_influence: "取り込んだ歴史と影響の主張をすべて一緒に表示します。各線には出典と確からしさが付いています。"
    glottolog_classifications_lexical_feature_study: "Glottolog の分類、語彙特徴の研究の系統樹、指文字のグループは、同じ記録を共有しつつ、根拠は別々に保っています。案内用の分類は共通の祖先ではありません。"
    source_specific_sampled_clades_share: "出典ごとの標本の分岐は、同じ言語の記録を共有します。ヨーロッパの 2 つの解析は、1 つの研究の繰り返しです。"
    historical_descent_graphic_influence_sample: "歴史的な系統、字形の影響、標本の同一性、文字の使用は、それぞれ別の関係です。全体に共通する祖先は主張していません。"
    these_records_remain_searchable_and: "これらの記録も検索して見られます。つながりが表示されていなくても、独立した起源を主張するものではありません。"
    standard_chapters_are_sections_of: "規格の章は 1 つの文献の節で、独立した研究ではありません。文献の参照と、取り込んだデータセットは区別しています。"
    the_transeurasian_paper_level_debate: "トランスユーラシア説の論文どうしの議論(提案、批判、応答)を含みます。これは系統樹の形の自動比較とは別のものです。"
    these_summary_clades_cannot_both: "これらの要約の分岐は、共通の標本の上で両方が成り立つことはありません。どちらの研究が正しいかは決まりません。下の例は、この記録を含むもっと広いグループに関わる場合があります。"
    this_atlas_preserves_every_imported: "この地図は、取り込んだ分類の主張をすべて出典つきで保っています。Glottocode が一致するものは 1 つの言語の記録にまとめます。出典ごとのグループと、対応づけていない標本は別の ID のままです。一覧に何度も出てくるのは同じ記録への参照で、別の言語ではありません。"
    this_is_not_every_published: "これは世界で公開されたすべての系統樹ではありません。Ethnologue の有料の完全な階層、地域ごとのすべての専門書、歴史上のすべての提案、カタログの文献一覧、すべての食い違いの論文ごとの確認は、取り込んでいません。別の説が表示されていない項目も、合意が確かめられたわけではありません。"
    every_assertion_retains_its_source: "すべての主張に出典が付いています。カタログの分類、語彙特徴の系統、指文字のグループ、字形の影響、文字体系の使用は、別々に扱います。「中間の段階を省略」は大まかな系統の主張で、直接の親ではありません。研究の根やカタログの分類は案内のための項目で、作り上げた 1 つの祖先ではありません。"
    glottolog_provides_the_navigation_backbone: "Glottolog を案内の骨組みにしています。WALS や研究の別の分岐は、できるときは共通の祖先の下に入れています。このつなぎは案内のためで、新しい系統の主張ではありません。語族をまたぐ系統樹と外群の系統樹は、別の案内欄に置いています。"
    language_details_query_the_public: "言語の詳細を開くと、公開されている Hugging Face Hub の API に問い合わせます。モデルカードの言語情報が、その記録の ISO コードか、対応する 2 文字コードとぴったり合うものだけを出します。方言や個別の言語に、親の言語やマクロ言語の対応を当てはめることはしません。多言語モデルも出ることがあります。情報は公開者が付けたもので、品質、その言語だけへの対応、方言の対応を保証しません。一覧はダウンロード数順の一部で、Hub の全結果へのリンクがあります。モデルの情報はその場で取得するもので、分類の XML/OPML には含みません。"
    xml_and_json_contain_every: "XML と JSON には、すべての記録、主張、メモ、出典、使用データ、入力のチェックサムが入っています。OPML は分類と歴史の主張の一覧(同じ記録は参照として繰り返し出ます)で、すべての情報や CLDR の使用表は含みません。出典ごとの権利はそのまま適用されます: Glottolog CC BY 4.0、SIL CC BY-SA 4.0、Power CLDF GPL-3.0、Unicode のデータは Unicode の利用条件。"
    sil_index_rows_exact_iso: "SIL の索引の行です。ISO コードが一致するものは記録を共有し、SIL 独自の識別子は別のままです。"
    all_glottolog_alias_rows_for: "手話の分類にある Glottolog の別名の行は、提供元のタグつきですべて保っています。ISO の英語・フランス語の名前と SIL の名前も残しています。確かめられたその言語での名前は、あるときだけ表示します。UCD の字形の見本は文字を示すもので、文字体系の自称ではありません。動画や手話表記による自称を作り上げてはいません。"
    all_sources_appear_together_repeated: "すべての出典を一緒に表示します。繰り返し出てくる系統は、共有している ID への参照です。起源についての別の説は、記録の詳細にリンクつきで示し、仮の主張にはその旨を書いています。ヨーロッパの 2 つの合意系統樹は同じ研究の独立した解析で、2 つの文献ではありません。すべての手話をまとめた系統樹は取り込んでいません。"
    top_level_entries_of_glottolog: "Glottolog 5.3 の最上位の項目です。どの記録にも、分類に沿った URL の専用ページがあります。"
    individual_source_citations_and_licenses: ": 個々の出典の引用とライセンスは下にあります。取り込んだ要約系統樹は、その著者と管理者に帰属します。コードの対応:"
    consult_each_original_source_before: "。再配布の前には、それぞれの元の資料を確かめてください。"
    classification: "分類 ·"
    name_search_is_exploratory_results: "名前の検索は手がかり探しのためのもので、結果が正しい対応とは限りません。"
    selected_historical_relationships_reviewed_chapter: "選んだ歴史上の関係を確認しています。章や節は独立した研究として数えていません。"
    all_language_sample_rows_and: "すべての言語と標本の行と、公開された下位グループの情報です。論文の網状のネットワークを再現したものではありません。"
    all_explicit_script_entries_under: "languageData にある文字の項目すべてです。主・副の区別も保っています。世界の正書法の完全な一覧ではなく、言語の系統も推定していません。"
    complete_imports_of_the_identified: "特定した版のカタログを丸ごと取り込んだもので、世界のすべての言語や文字の完全な一覧ではありません。"

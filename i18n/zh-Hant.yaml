    a_conflicting_summary_topology_does: "彙總拓撲的衝突並不能確定哪一種科學主張正確。後驗不確定性以及各論文中的全部分析均未經審查。"
    a_script_is_not_a: "文字不是語系。歷史淵源、字形影響和語言使用是不同的；缺少祖先表示尚未審查，並不能證明是獨立發明的。"
    a_shared_writing_system_or: "使用相同的文字系統或指拼字母，並不能證明語言有共同祖先。"
    all_imported_historical_and_influence: "所有匯入的歷史和影響主張並列顯示；每條連線都附有來源和不確定程度。"
    glottolog_classifications_lexical_feature_study: "Glottolog 分類、基於詞彙特徵的研究譜系樹和指拼字母分組共用同一紀錄，但各自的證據分開保存。導覽類別並不是共同祖先。"
    source_specific_sampled_clades_share: "各來源的樣本分支共用相同的語言紀錄。兩次歐洲分析是同一研究的重複。"
    historical_descent_graphic_influence_sample: "歷史淵源、字形影響、樣本同一性和文字使用是不同的關係。不主張存在全域的共同祖先。"
    these_records_remain_searchable_and: "這些紀錄仍可搜尋和查看。未顯示關聯並不是主張其起源獨立。"
    standard_chapters_are_sections_of: "標準的各章是同一出版品的章節，而不是獨立的研究。文獻參考與匯入的資料集相區分。"
    the_transeurasian_paper_level_debate: "關於泛歐亞語系的論文爭論包括提出、批評和回應。這與拓撲的自動比較不同。"
    these_summary_clades_cannot_both: "這些彙總分支在共同的樣本末端上不可能同時成立。這並不能確定哪一項研究正確。下面的例子可能涉及包含這筆紀錄的更大分組。"
    this_atlas_preserves_every_imported: "本圖譜保存每項匯入的分類主張及其來源。Glottocode 完全一致的條目共用同一筆語言紀錄。來源特有的分組和未對應的樣本保留各自的 ID。在清單中重複出現的是對同一紀錄的參照，而不是新的語言。"
    this_is_not_every_published: "這並不是全世界所有已發表的譜系樹。未收錄 Ethnologue 的完整專有層級、所有地區性專著、所有歷史上的提議、目錄的文獻清單，以及對每一處衝突逐篇論文的完整審查。未顯示其他說法的節點並未被認定為共識。"
    every_assertion_retains_its_source: "每項主張都保留其來源。目錄分類、基於詞彙特徵的系統發生、指拼字母分組、字形影響和文字系統的使用彼此區分。「省略中間階段」表示概括的歷史淵源主張，而不是直接的上位。研究的根和目錄類別是導覽用的條目，而不是虛構的單一祖先。"
    glottolog_provides_the_navigation_backbone: "Glottolog 構成導覽的骨架。WALS 和研究中的其他分支盡可能嵌入其共同祖先之下。這種連接僅用於導覽，並不是新的譜系主張。跨語系 / 外群的譜系樹放在單獨的導覽欄目中。"
    language_details_query_the_public: "開啟語言詳情時，會依需要查詢公開的 Hugging Face Hub API。結果要求模型卡的語言資訊與該紀錄本身的 ISO 代碼及其對應的兩字母代碼完全一致。不會把上位語言或巨集語言的支援推及方言或個別語言。可能出現多語言模型。資訊由發布者提供，並不保證品質、僅支援該語言或涵蓋方言。清單是依下載次數排序的有限樣本，並附有指向 Hub 全部結果的連結。模型資訊為即時取得，不包含在分類的 XML/OPML 匯出中。"
    xml_and_json_contain_every: "XML 和 JSON 包含每筆紀錄、主張、註記、來源、使用資料和輸入檢查碼。OPML 是分類和歷史主張的大綱（同一紀錄以參照形式重複出現），不包含全部資訊和 CLDR 使用表。各來源的權利仍然適用：Glottolog CC BY 4.0、SIL CC BY-SA 4.0、Power CLDF GPL-3.0、Unicode 資料適用 Unicode 條款。"
    sil_index_rows_exact_iso: "SIL 索引條目。ISO 代碼完全一致的條目共用紀錄；SIL 自有的識別碼保持獨立。"
    all_glottolog_alias_rows_for: "手語類別中 Glottolog 的所有別名條目均連同提供者標籤一併保存。保留 ISO 的英語和法語名稱以及 SIL 名稱。經查證的本語言名稱在有時顯示。UCD 字形樣本顯示的是字元，而不是文字的自稱。沒有虛構影片或手語記號形式的自稱。"
    all_sources_appear_together_repeated: "所有來源並列顯示。重複的分支是對共用 ID 的參照。關於起源的其他說法附連結顯示在紀錄詳情中；暫定的主張已加標註。兩棵歐洲共識譜系樹是同一研究的獨立分析，而不是兩篇出版品。未匯入涵蓋所有手語的譜系樹。"
    top_level_entries_of_glottolog: "Glottolog 5.3 的最高層級條目。每筆紀錄都有自己的網頁，其網址與分類對應。"
    individual_source_citations_and_licenses: "：各來源的引文和授權條款見下文。匯入的彙總譜系樹歸其作者和維護者所有。代碼對應："
    consult_each_original_source_before: "。再次散布前，請查閱各原始來源。"
